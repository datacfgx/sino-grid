name: probe telegram
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          echo "== resposta crua do telegram =="
          curl -s -m 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" --data-urlencode "text=SONDA SINO - se chegou, telegram ok"
