name: GH-KALI Ambulancia
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP Tailscale do G52 (100.x.y.z)"
        required: true
      porta_con:
        description: "Porta de conexao (ou SCAN)"
        required: true
      matar:
        description: "pacotes p/ force-stop (vazio = so diagnostico + trim-caches)"
        required: false
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: platform-tools 33.0.3
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
      - name: Chave da casa
        run: |
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
      - name: Descobre porta
        if: ${{ inputs.porta_con == 'SCAN' }}
        run: |
          PORT=$(seq 30000 50000 | xargs -P 300 -I{} sh -c 'nc -z -w1 ${{ inputs.alvo }} {} 2>/dev/null && echo {}' | head -1)
          echo "PORTA_DETECTADA=$PORT" >> $GITHUB_ENV
          echo "porta: $PORT"
      - name: Conecta
        run: |
          A=/tmp/platform-tools/adb
          P="${{ inputs.porta_con }}"
          if [ "$P" = "SCAN" ]; then P="$PORTA_DETECTADA"; fi
          for t in 1 2 3 4 5; do $A connect ${{ inputs.alvo }}:$P && break; sleep 3; done
          [ "$($A get-state 2>/dev/null)" = "device" ] || { echo "aparelho nao respondeu"; exit 1; }
      - name: Diagnostico
        run: |
          A=/tmp/platform-tools/adb
          S() { echo; echo "### $1"; $A shell "$2"; }
          S "BATERIA" "dumpsys battery | grep -E 'level|health|status|temp|voltage|technology'"
          S "CARGA/MODO" "dumpsys battery | grep -E 'charge counter|status|plug|Charging' "
          S "RAM" "cat /proc/meminfo | grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree'"
          S "ARMAZENAMENTO" "df /data /cache 2>/dev/null | grep -v Filesystem"
          S "UPTIME/CARGA" "uptime"
          S "DEPURACAO" "settings get global adb_enabled"
          S "TOP MEMORIA" "dumpsys meminfo | head -18"
          S "TOP BATERIA" "dumpsys batterystats | grep -A 12 'Estimated power use' | head -30"
          S "REDES" "dumpsys connectivity | grep -E 'Active default|Metered' | head -4"
      - name: Remedio (seguro)
        run: |
          A=/tmp/platform-tools/adb
          echo "### trim-caches"
          $A shell pm trim-caches 999999999999 || true
          MATAR="${{ inputs.matar }}"
          if [ -n "$MATAR" ]; then
            IFS=','; for p in $MATAR; do
              echo "### force-stop $p"
              $A shell am force-stop "$p" || true
            done
          fi
      - name: Pos-remedio
        run: |
          A=/tmp/platform-tools/adb
          echo "### RAM depois"; $A shell cat /proc/meminfo | grep -E 'MemAvailable'
          echo "### ARMAZ depois"; $A shell df /data | tail -1
      - name: Resumo pro Telegram
        if: always()
        run: |
          curl -s -F text="ambulancia finalizada — diagnostico + remedio no log da run" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" > /dev/null
