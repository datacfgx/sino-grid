name: GH-KALI Build Probe ENI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: NDK r26b
        run: |
          curl -sL -m 300 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q /tmp/ndk.zip -d /tmp
          ls /tmp/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
      - name: Gradle 8.7
        run: |
          curl -sL -m 120 -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/g.zip -d /tmp && /tmp/gradle-8.7/bin/gradle --version | head -4
      - name: SDK 35
        run: |
          SM=$(find $ANDROID_HOME $ANDROID_SDK_ROOT /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)
          echo "SM=$SM"
          test -n "$SM"
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
      - name: hello bionic estatico
        run: |
          CC=/tmp/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/clang
          mkdir -p apps/probe-eni/app/src/main/assets
          $CC --target=aarch64-linux-android23 -static -O2 -o apps/probe-eni/app/src/main/assets/hello apps/probe-eni/hello.c
          file apps/probe-eni/app/src/main/assets/hello
      - name: Build
        run: |
          cd apps/probe-eni
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/
      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: apps/probe-eni/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      - name: Envia APK pro Telegram
        run: |
          APK=$(ls apps/probe-eni/app/build/outputs/apk/debug/*.apk)
          curl -s -F document=@"$APK" -F caption="Probe ENI v4 (hello bionico estatico)" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}"
