name: GH-KALI Probe Relay
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: anuncia g52 no KV e le de volta
        run: |
          INFO='{"id":"g52","model":"motorola moto g52","android":"13","ver":"2.4.1"}'
          E=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$INFO")
          curl -s -m 20 "https://sino-relay.worldeffects752.workers.dev/announce?info=$E"; echo
          curl -s -m 20 "https://sino-relay.worldeffects752.workers.dev/registry"; echo
