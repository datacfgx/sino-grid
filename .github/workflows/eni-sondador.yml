name: ENI Sondador
on:
  workflow_dispatch:
  push:
    branches: [eni-sonda]
    paths: ['targets.txt']

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-sonda
      - name: sondar
        run: python3 sondar.py
      - uses: actions/upload-artifact@v4
        with:
          name: sonda
          path: sonda-*
      - name: resumo no telegram
        run: |
          for i in 1 2 3; do
            resp=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=Sondador rodou — relatório no artifact da run")
            echo "$resp" | grep -q '"ok":true' && break
            sleep 8
          done
