name: ENI Sondador
on:
  workflow_dispatch:
  push:
    branches: [eni-sonda]
    paths: ['targets.txt']

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-sonda
      - name: sondar
        run: python3 sondar.py
      - uses: actions/upload-artifact@v4
        with:
          name: sonda
          path: sonda-*
