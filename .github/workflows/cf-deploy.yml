name: cf deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy sino-tubo
        env:
          CF_API_TOKEN: "${{ secrets.CF_TOKEN }}"
        run: |
          curl -s -m 20 -H "Authorization: Bearer $CF_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify
