name: GH-KALI Android
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
      - name: deps do emulador oficial
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 xvfb x11vnc novnc websockify mesa-vulkan-drivers vulkan-tools
          sudo chmod a+rw /dev/kvm || true
      - name: sdk + imagem android 11 x86_64
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$GITHUB_WORKSPACE/sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$GITHUB_WORKSPACE/sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis_playstore;x86_64" "platforms;android-30" > /dev/null
          "$GITHUB_WORKSPACE/sdk/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis_playstore;x86_64" --device "pixel_4" --force
          echo "AVD criado"
      - name: sobe emulador com tela via Xvfb
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export DISPLAY=:0
          Xvfb :0 -screen 0 1080x1920x24 > xvfb.log 2>&1 &
          sleep 3
          ls -la /tmp/.X11-unix/ || true
          cat xvfb.log || true
          nohup emulator -avd eni -no-audio -no-boot-anim -gpu guest -accel on -wipe-data -no-snapshot -no-metrics -ports 5554,5555 > emulator.log 2>&1 &
          sleep 5
          x11vnc -display :0 -forever -nopw -shared -rfbport 5900 > vnc.log 2>&1 &
          sleep 3
          nohup websockify --web /usr/share/novnc 7681 localhost:5900 > novnc.log 2>&1 &
          sleep 10
          echo "== ps emulator =="
          ps aux | grep -c "[e]mulator" || true
          echo "== emulator.log =="
          cat emulator.log 2>/dev/null || echo "(sem log)"
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; exit 1; }
          echo "emulador vivo + vnc + novnc no ar"
      - name: aguarda boot e anuncia
        run: |
          export PATH="$GITHUB_WORKSPACE/sdk/platform-tools:$PATH"
          TSIP=$(tailscale ip -4 2>/dev/null || true)
          [ -z "$TSIP" ] && TSIP="sem-ip"
          echo "TSIP=$TSIP"
          MSG="ANDROID NO AR v8 emulador oficial Google
          endereco: http://$TSIP:7681/vnc.html?autoconnect=true
          vida util: ~6h"
          for t in 1 2 3 4 5; do
            R=$(curl -s -w "HTTP:%{http_code}" -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MSG")
            echo "tentativa $t: $R"
            case "$R" in *HTTP:200*) break;; esac
            sleep $((t*5))
          done
      - name: espera android ligar e manda foto
        run: |
          export PATH="$GITHUB_WORKSPACE/sdk/platform-tools:$PATH"
          adb connect localhost:5555 > /dev/null 2>&1 || true
          BC=""
          for i in $(seq 1 30); do
            sleep 20
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "[$i] boot_completed=$BC"
            [ "$BC" = "1" ] && break
          done
          if [ "$BC" = "1" ]; then
            sleep 10
            adb -s localhost:5555 exec-out screencap -p > tela.png 2>/dev/null || true
            for t in 1 2 3; do
              R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="ANDROID ABRIU - tela oficial v8" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
              echo "foto $t: $R"
              case "$R" in *HTTP:200*) break;; esac
              sleep 10
            done
          fi
      - name: vive 6h com foto da tela a cada 30min
        run: |
          export PATH="$GITHUB_WORKSPACE/sdk/platform-tools:$PATH"
          for i in $(seq 1 12); do
            sleep 1800
            adb -s localhost:5555 exec-out screencap -p > tela.png 2>/dev/null || true
            [ -s tela.png ] && curl -s -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="[tela v8 $i]" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto" >/dev/null || true
          done
