name: GH-KALI Android
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci
      - name: qemu + vnc web
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils novnc websockify python3
      - name: baixa android-x86 9.0
        run: |
          set -e
          AX="https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso"
          baixou=""
          for u in "$AX" "https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"; do
            rm -f ax.iso
            curl -sL --max-time 900 --speed-limit 20000 --speed-time 45 -o ax.iso "$u" && baixou=1 && break
          done
          test -n "$baixou" || { echo "ISO nao baixou"; exit 1; }
          ls -la ax.iso
          qemu-img create -f qcow2 ax.qcow2 10G
      - name: boot android-x86 com flags dock-droid
        run: |
          sudo chmod a+rw /dev/kvm || true
          mkdir -p isomnt && sudo mount -o loop,ro ax.iso isomnt
          cp isomnt/kernel isomnt/initrd.img . 2>/dev/null || true
          APPEND=$(grep -rhoE 'append[[:space:]]+.*' isomnt/isolinux/ isomnt/boot/ 2>/dev/null | grep -v INSTALL | grep -E 'DEBUG=2|DEBUG=1' | head -1 | sed 's/^append[[:space:]]*//')
          if [ -z "$APPEND" ]; then APPEND="root=/dev/ram0 DEBUG=2"; fi
          if ! echo "$APPEND" | grep -q "SRC="; then APPEND="$APPEND SRC=/dev/sr0"; fi
          APPEND="$APPEND console=ttyS0"
          echo "APPEND=$APPEND"
          sudo umount isomnt
          CPUFLAGS="+invtsc,vmware-cpuid-freq=on,+pcid,+ssse3,+sse4.2,+popcnt,+avx,+aes,+xsave,+xsaveopt,check"
          nohup qemu-system-x86_64 -m 4096 -enable-kvm -cpu host,$CPUFLAGS -machine q35,accel=kvm:tcg -smp 4 -kernel kernel -initrd initrd.img -append "$APPEND" -hda ax.qcow2 -cdrom ax.iso -usb -device usb-kbd -device usb-tablet -smbios type=2 -device vmxnet3,netdev=net0 -netdev user,id=net0,hostfwd=tcp::5555-:5555 -vnc 0.0.0.0:0 -serial file:qemu-serial.log > qemu.log 2>&1 &
          sleep 5
          cat qemu.log
          nohup websockify --web /usr/share/novnc 7681 localhost:5900 > novnc.log 2>&1 &
          echo "VM android-x86 flags dock-droid e noVNC no ar"
      - name: anuncia no telegram
        run: |
          TSIP=$(tailscale ip -4 2>/dev/null || echo "sem-ip")
          MSG="ANDROID NO AR v4 flags dock-droid SSE4.2
          endereco: http://$TSIP:7681/vnc.html?autoconnect=true
          vida util: ~6h"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=$MSG"
          echo "anunciado: $TSIP:7681"
      - name: vive 6h com telemetria
        run: |
          ADB="adb -s localhost:5555"
          for i in $(seq 1 36); do
            sleep 600
            echo "== [$i] $(date -u +%H:%M) =="
            tail -3 qemu-serial.log 2>/dev/null || true
            adb connect localhost:5555 >/dev/null 2>&1 || true
            BC=$($ADB shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "boot_completed=$BC"
            if [ "$BC" = "1" ]; then
              $ADB exec-out screencap -p > tela.png 2>/dev/null || true
              if [ -s tela.png ]; then
                curl -s -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="Android vivo - tela ao vivo v4" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto" >/dev/null || true
              fi
            else
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=[telemetria v4] boot_completed='$BC' serial: $(tail -1 qemu-serial.log 2>/dev/null)" >/dev/null || true
            fi
          done
