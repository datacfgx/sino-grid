name: GH-KALI Build APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlipperDroid
        uses: actions/checkout@v4
        with:
          repository: Jeremiznoo/FlipperDroid

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 35 + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace -q
          ls -la build/outputs/apk/debug/

      - name: Envia APK pro Telegram
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          APK=$(ls build/outputs/apk/debug/*.apk | head -1)
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
            -F chat_id="${TG_CHAT}" \
            -F document=@"${APK}" \
            -F caption="FlipperDroid APK (debug build) - pronto pra instalar no G52" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipperdroid-apk
          path: build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
