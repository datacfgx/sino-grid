name: GH-KALI APK Restyle
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
        type: string
permissions:
  contents: read
jobs:
  restyle:
    runs-on: ubuntu-latest
    steps:
      - name: Ferramentas
        run: |
          curl -sL -m 60 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          ls -la /tmp/apktool.jar
          SM=$(find $ANDROID_HOME -name sdkmanager -type f 2>/dev/null | head -1)
          yes | $SM --licenses > /dev/null 2>&1 || true
          $SM "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Baixa APK
        run: curl -sL -m 120 -o /tmp/app.apk "${{ inputs.url }}" && ls -la /tmp/app.apk

      - name: Troca so o fundo do GRAVAR
        run: |
          cd /tmp
          java -jar apktool.jar d app.apk -o out
          ls out/res/layout/ | head -8
          mkdir -p out/res/drawable
          cat > out/res/drawable/btn_gravar_prata.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#B0BEC5"/>
              <corners android:radius="28dp"/>
          </shape>
          EOF
          sed -i 's/^          //' out/res/drawable/btn_gravar_prata.xml
          ALVO=$(grep -rl 'btnRec' out/res/layout/ | head -1)
          echo "arquivo do btnRec: $ALVO"
          L=$(grep -n 'btnRec' "$ALVO" | head -1 | cut -d: -f1)
          echo "linha: $L"
          [ -z "$L" ] && { echo "btnRec nao achado"; exit 1; }
          sed -i "${L}"'s| android:background="[^"]*"||g' "$ALVO"
          sed -i "${L}"'s|android:id="@id/btnRec"|android:background="@drawable/btn_gravar_prata" android:id="@id/btnRec"|' "$ALVO"
          sed -i "${L}"'s|<Button android:id="@id/btnRec"|<Button android:textStyle="bold" android:textSize="18sp" android:id="@id/btnRec"|' "$ALVO"
          SMALI=$(grep -rl '4CAF50' out/smali*/ | head -1)
          echo "smali verde: $SMALI"
          sed -i 's/#4CAF50/#00A047/g' "$SMALI"
          grep -o '#00A047' "$SMALI" | head -2
          sed -n "${L}p" "$ALVO"

      - name: Camera HQ (edge/nr/hotpixel/tonemap no smali)
        run: |
          cd /tmp
          SMALI=$(grep -rl 'CONTROL_VIDEO_STABILIZATION_MODE' out/smali*/ | head -1)
          echo "smali alvo: $SMALI"
          python3 <<'PYEOF'
          import re
          p = os.environ.get("SMALI_PATH")
          lines = open(p).read().splitlines()
          out = []
          inserido = 0
          BLOCO = None
          for i, l in enumerate(lines):
              out.append(l)
              if 'CONTROL_VIDEO_STABILIZATION_MODE' in l and 'invoke-virtual' in l and '->set(' in l:
                  m = re.search(r'invoke-virtual \{([vp]\d+)', l)
                  reg = m.group(1)
                  for key, val in [('EDGE_MODE','0x2'), ('NOISE_REDUCTION_MODE','0x2'), ('HOT_PIXEL_MODE','0x2'), ('TONEMAP_MODE','0x1')]:
                      out += [
                          f'sget-object v2, Landroid/hardware/camera2/CaptureRequest;->{key}:Landroid/hardware/camera2/CaptureRequest$Key;',
                          f'const/4 v3, {val}',
                          'invoke-static {v3}, Ljava/lang/Integer;->valueOf(I)Ljava/lang/Integer;',
                          'move-result-object v3',
                          f'invoke-virtual {{{reg}, v2, v3}}, Landroid/hardware/camera2/CaptureRequest$Builder;->set(Landroid/hardware/camera2/CaptureRequest$Key;Ljava/lang/Object;)V']
                  inserido = 4
          open(p, 'w').write("\n".join(out) + "\n")
          print("sets inseridos:", inserido)
          PYEOF

      - name: Rebuild e assina
        run: |
          cd /tmp
          java -jar apktool.jar b out -o mod-unsigned.apk
          BT=$(dirname $(find $ANDROID_HOME -name zipalign -type f | head -1))
          keytool -genkeypair -keystore /tmp/k.jks -storepass senha123 -keypass senha123 -alias mod \
            -dname "CN=ENI, OU=Sino, O=Familia, L=SP, ST=SP, C=BR" -keyalg RSA -keysize 2048 -validity 3650 > /dev/null 2>&1
          $BT/zipalign -f 4 mod-unsigned.apk mod-aligned.apk
          $BT/apksigner sign --ks /tmp/k.jks --ks-pass pass:senha123 --out app-restyle.apk mod-aligned.apk

      - name: Envia
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          cd /tmp
          for t in 1 2 3; do
            RESP=$(curl -s -m 90 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT}" \
              -F document=@app-restyle.apk \
              -F caption="MicCam RESTYLE - fundo do GRAVAR cinza escuro, resto identico")
            echo "$RESP" | grep -q '"ok":true' && break
            sleep 12
          done
          echo "$RESP"

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-restyle
          path: /tmp/app-restyle.apk
          retention-days: 3
          if-no-files-found: error
