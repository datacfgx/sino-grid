name: GH-KALI
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
jobs:
  kali:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Kali
        run: docker pull kalilinux/kali-rolling

      - name: Start Kali box
        run: docker run -d --name kali kalilinux/kali-rolling sleep infinity

      - name: Install base arsenal
        run: |
          BASE=$(jq -r '.base | join(" ")' tools.json)
          EXTRAS=$(jq -r '.install | join(" ")' fila.json)
          echo "base: $BASE"
          echo "extras: $EXTRAS"
          docker exec kali bash -c "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $BASE $EXTRAS"

      - name: Run command queue
        run: |
          rm -f resultado.txt
          COUNT=$(jq ".comandos | length" fila.json)
          for i in $(seq 0 $((COUNT-1))); do
            CMD=$(jq -r ".comandos[$i]" fila.json)
            echo "===== CMD $i: $CMD =====" >> resultado.txt
            docker exec kali bash -c "$CMD" >> resultado.txt 2>&1 || echo "[exec falhou]" >> resultado.txt
            echo "[fim cmd $i]" >> resultado.txt
            echo "" >> resultado.txt
          done
          cat resultado.txt || true

      - name: Commit resultado no repo
        run: |
          cp resultado.txt resultado.md
          git config user.name "GH-KALI"
          git config user.email "gh-kali@local"
          git add resultado.md
          git commit -m "resultado: $(date -u +%Y-%m-%d_%H%M) UTC" || echo "sem mudancas"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kali-resultado
          path: resultado.txt
          retention-days: 3
          if-no-files-found: ignore
