name: GH-KALI Tools
on:
  workflow_dispatch:
    inputs:
      tool:
        required: true
        type: string
      args:
        required: false
        type: string
        default: ""
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Roda ferramenta
        run: |
          docker pull -q kalilinux/kali-rolling
          docker run -d --name kali kalilinux/kali-rolling sleep infinity
          docker exec kali bash -c "apt-get update -qq && apt-get install -y -qq python3 curl" || true
          docker cp tools kali:/tools
          cat > run.sh <<'TOOL_EOF'
          python3 /tools/${{ inputs.tool }}.py ${{ inputs.args }}
          TOOL_EOF
          docker cp run.sh kali:/run.sh
          docker exec kali bash /run.sh > saida.txt 2>&1 || true
          head -c 3500 saida.txt
      - name: Responde
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          MSG=$(head -c 3800 saida.txt)
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=TOOL[${{ inputs.tool }}]: ${MSG}" || true
