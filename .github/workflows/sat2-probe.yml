name: tubo probe ws
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe wss ctl + saude
        run: |
          echo "== saude REST =="
          curl -s -m 20 "https://sino-tubo.worldeffects752.workers.dev/cmd?id=posto1&token=eni5dd7a2a80621e280203d56c36c20cbc3"
          echo
          echo "== ws ctl (node 22 nativo) =="
          node -e "
          const ws = new WebSocket('wss://sino-tubo.worldeffects752.workers.dev/ws?id=posto1&token=eni5dd7a2a80621e280203d56c36c20cbc3&role=ctl');
          ws.onopen = () => { console.log('WS OPEN'); };
          ws.onmessage = (e) => { console.log('MSG:', e.data); };
          ws.onerror = (e) => { console.log('WS ERRO'); };
          ws.onclose = (e) => { console.log('WS CLOSE', e.code); process.exit(0); };
          setTimeout(() => { console.log('fim do teste'); process.exit(0); }, 10000);
          "
