name: entrega streamx
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entrega:
    runs-on: ubuntu-latest
    steps:
      - name: baixa, fatia e envia
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          curl -sL -m 300 -o /tmp/streamx.apk "https://github.com/datacfgx/sino-grid/releases/download/apk-mod/app-mod-assinado.apk"
          ls -la /tmp/streamx.apk
          split -b 44m /tmp/streamx.apk /tmp/streamx.part_
          ls -la /tmp/streamx.part_*
          N=0
          for p in /tmp/streamx.part_*; do
            N=$((N+1))
            echo "enviando $p (parte $N)"
            curl -s -m 240 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT}" \
              -F document=@"${p}" \
              -F caption="StreamX parte ${N}/3 - renomeie para streamx.part_0${N}"
          done
          curl -s -m 30 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode "text=StreamX completo: sh cat /sdcard/Download/streamx.part_01 /sdcard/Download/streamx.part_02 /sdcard/Download/streamx.part_03 > /sdcard/Download/streamx.apk  (depois instale o streamx.apk)"
