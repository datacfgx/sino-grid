name: GH-KALI Diag Tailnet
run-name: diag ${{ inputs.alvo }}
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP tailnet do aparelho"
        required: true
        default: "100.72.251.47"
      porta:
        description: "Porta adbd"
        required: true
        default: "40333"
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: diagnostico
        run: |
          ALVO="${{ inputs.alvo }}"
          PORTA="${{ inputs.porta }}"
          {
            echo "== tailscale status =="
            sudo tailscale status | head -12
            echo "== tailscale ping =="
            sudo tailscale ping -c 3 --timeout 3s "$ALVO" 2>&1 | head -5
            echo "== tcp probe =="
            python3 - "$ALVO" "$PORTA" <<'PYEOF'
          import socket, sys
          alvo, porta = sys.argv[1], int(sys.argv[2])
          s = socket.socket()
          s.settimeout(5)
          try:
              s.connect((alvo, porta))
              print("TCP OK: conectou em", alvo, porta)
              s.sendall(b"CNXNvazio")
          except Exception as e:
              print("TCP FALHOU:", type(e).__name__, str(e))
          finally:
              s.close()
          PYEOF
            echo "== fim =="
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          python3 - <<'PYEOF'
          import json, os, urllib.request
          txt = "DIAG TAILNET:\n" + open("/tmp/diag.txt").read()[:800]
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": txt}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=15).read().decode()[:120])
          PYEOF
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
