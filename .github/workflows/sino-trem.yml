name: GH-KALI Trem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trem:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta proximo trem L8
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          python3 <<'PYEOF'
          import urllib.request, json, os

          API = "https://apim-proximotrem-prd-brazilsouth-001.azure-api.net/api/v1/lines/L8/stations/{}/next-train"
          NOMES = {"JSI": "Jardim Silveira", "IPV": "Itapevi"}
          SENTIDOS = {"IPV": "Itapevi", "ECD": "Itapevi"}

          def get(code):
              with urllib.request.urlopen(API.format(code), timeout=12) as r:
                  return json.loads(r.read().decode())

          def sentido(dest):
              return "sentido Itapevi" if dest in SENTIDOS else "sentido Júlio Prestes (Centro)"

          def linhas(estacao, code):
              trens = get(code)
              if not trens:
                  return f"{estacao}: sem previsão no momento"
              out = [f"{estacao}:"]
              for t in trens[:2]:
                  seg = t.get("proximo_em")
                  tempo = f"{int(seg)//60}min{int(seg)%60:02d}s" if seg is not None else "?"
                  prev = t.get("hora_previsto_chegada", "?")
                  st = t.get("status", "?")
                  out.append(f"  {sentido(t.get('estacao_destino','?'))}: chega em {tempo} ({prev}) [{st}]")
              return "\n".join(out)

          try:
              msg = "TREM L8 - DIAMANTE\n\n" + "\n\n".join(linhas(NOMES[c], c) for c in ("JSI", "IPV"))
          except Exception:
              msg = "TREM L8 - DIAMANTE\n\n\u23f3 fonte (ViaMobilidade) fora do ar no momento\n\u23f3 tenta de novo em alguns minutos"
          print(msg)
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg}).encode(),
              headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=15)
          PYEOF
