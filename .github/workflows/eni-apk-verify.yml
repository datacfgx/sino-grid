name: ENI APK Verify
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "tag da release"
        default: "apk-capcut-20261112-apkpure"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: baixar e identificar o assinante
        run: |
          set -e
          GH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          AID=$(curl -s -H "$GH" "$API/releases/tags/${{ inputs.tag }}" | python3 -c "import sys,json;print(json.load(sys.stdin)['assets'][0]['id'])")
          curl -sL -H "$GH" -H "Accept: application/octet-stream" -o app.apk "https://api.github.com/repos/${{ github.repository }}/releases/assets/$AID"
          ls -l app.apk
          sha256sum app.apk
          keytool -printcert -jarfile app.apk 2>/dev/null | grep -E "Signer #1|Certificate #1|Owner|Issuer|Valid" | head -8 || echo "keytool indisponivel, caindo pro openssl"
          python3 - << 'PY'
          import zipfile
          z = zipfile.ZipFile("app.apk")
          cert = [n for n in z.namelist() if n.upper().startswith("META-INF/") and n.upper().endswith((".RSA", ".DSA", ".EC"))]
          print("blocos META-INF:", cert)
          z.extract(cert[0], "/tmp/cert")
          PY
          F=$(ls /tmp/cert/META-INF/*.{RSA,EC,DSA} 2>/dev/null | head -1)
          (openssl pkcs7 -inform DER -in "$F" -print_certs -out /tmp/c.pem 2>/dev/null || openssl pkcs7 -inform PEM -in "$F" -print_certs -out /tmp/c.pem 2>/dev/null) || true
          openssl x509 -in /tmp/c.pem -noout -subject -issuer -startdate -enddate 2>/dev/null || true
