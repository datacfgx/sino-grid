name: GH-KALI Manda APK
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  manda:
    runs-on: ubuntu-latest
    steps:
      - name: baixa artifact e manda pro Telegram
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, zipfile, io
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path,
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
              return json.loads(urllib.request.urlopen(req, timeout=60).read())
          runs = api("/repos/datacfgx/sino-grid/actions/runs?per_page=10")["workflow_runs"]
          build = next(r for r in runs if "Sino-Client" in r["name"] and r.get("conclusion") == "success")
          arts = api(f"/repos/datacfgx/sino-grid/actions/runs/{build['id']}/artifacts")["artifacts"]
          req = urllib.request.Request(
              f"https://api.github.com/repos/datacfgx/sino-grid/actions/artifacts/{arts[0]['id']}/zip",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(req, timeout=30)
          except urllib.error.HTTPError as e:
              loc = e.headers["Location"]
          zbuf = urllib.request.urlopen(loc, timeout=120).read()
          zf = zipfile.ZipFile(io.BytesIO(zbuf))
          apk = [n for n in zf.namelist() if n.endswith(".apk")][0]
          open("/tmp/cora.apk", "wb").write(zf.read(apk))
          print("apk:", os.path.getsize("/tmp/cora.apk"), "bytes")
          subprocess.run(["curl", "-s", "-F", "document=@/tmp/cora.apk",
              "-F", "caption=CORA v1.7 💓 — a chave da clínica",
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendDocument",
              "-F", f"chat_id={os.environ['TG_CHAT']}"], timeout=60)
          print("mandado pro telegram")
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
