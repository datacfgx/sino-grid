name: ENI ProxyBR
on:
  push:
    branches: [eni-proxybr]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-proxybr
      - name: probe BR v2
        run: |
          chmod +x probe-br.sh
          ./probe-br.sh | tee probe-resultado.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-br
          path: probe-resultado.txt
