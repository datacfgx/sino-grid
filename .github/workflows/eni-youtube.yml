name: ENI YouTube
on:
  workflow_dispatch:
    inputs:
      url:
        description: link do video
        required: true
jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: yt-dlp via ProxyBR (IP residencial)
        run: |
          set +e
          curl -sL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x yt-dlp
          ./yt-dlp --version
          P1=$(curl -s --max-time 40 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=http&timeout=8000&ssl=all&anonymity=all" | grep -E ':' | sed 's|^|http://|')
          P2=$(curl -s --max-time 40 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=socks5&timeout=8000" | grep -E ':' | sed 's|^|socks5://|')
          P3=$(curl -s --max-time 40 "https://www.proxy-list.download/api/v1/get?type=https" | grep -E ':' | sed 's|^|http://|')
          P4=$(curl -s --max-time 40 "https://www.proxy-list.download/api/v1/get?type=socks5" | grep -E ':' | sed 's|^|socks5://|')
          LIST=$(printf '%s\n%s\n%s\n%s\n' "$P1" "$P2" "$P3" "$P4" | sort -u | head -40)
          echo "proxies coletados (mundo): $(echo "$LIST" | wc -l)"
          ok=""
          for proxy in $LIST; do
            code=$(curl -s -x "$proxy" --max-time 8 -o /dev/null -w "%{http_code}" https://www.youtube.com/generate_204 2>/dev/null)
            if [ "$code" != "204" ]; then continue; fi
            echo "proxy vivo: $proxy - tentando download"
            if LOG=$(./yt-dlp --proxy "http://$proxy" --socket-timeout 20 --retries 1 -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]" --merge-output-format mp4 -o "video.%%(ext)s" --no-playlist --extractor-args "youtube:player_client=android,web" "${{ github.event.inputs.url }}" 2>&1); then
              ok=1
              echo "BAIXOU via $proxy"
              echo "$LOG" | tail -3
              break
            else
              echo "falhou via $proxy: $(echo "$LOG" | tail -2 | tr "\n" " ")"
            fi
          done
          if [ -z "$ok" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=ENI YouTube: nenhum proxy BR concluiu o download (tente de novo - lista muda)"
            exit 1
          fi
          ls -la video.*
      - name: entrega no telegram
        run: |
          T="${{ secrets.TELEGRAM_TOKEN }}"
          C="${{ secrets.TELEGRAM_CHAT_ID }}"
          F=$(ls video.* | head -1)
          S=$(stat -c%s "$F")
          echo "arquivo: $F ($S bytes)"
          if [ "$S" -le 48000000 ]; then
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="$C" -F document=@"$F" -F caption="ENI YouTube ok ($S bytes)" "https://api.telegram.org/bot$T/sendDocument")
            echo "inteiro: $R"
          else
            split -b 45000000 "$F" parte_
            for p in parte_*; do
              curl -s -F chat_id="$C" -F document=@"$p" "https://api.telegram.org/bot$T/sendDocument"
              sleep 3
            done
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=junte no termux: cat parte_* > video.mp4"
            echo "fatiado e entregue"
          fi
