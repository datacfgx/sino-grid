name: ENI YouTube
on:
  workflow_dispatch:
    inputs:
      url:
        description: link do video
        required: true
jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: caçada real (engine da casa modernizada)
        run: |
          set +e
          curl -sL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x yt-dlp
          LINK="${{ github.event.inputs.url }}"
          printf '%s\n' "${{ secrets.YT_COOKIES }}" > cookies.txt
          chmod 600 cookies.txt
          ok=""
          echo "== fase 0: direto =="
          if ./yt-dlp --cookies cookies.txt --socket-timeout 20 --retries 1 -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]" --merge-output-format mp4 -o "video.%%(ext)s" --no-playlist "$LINK" > /dev/null 2>&1; then ok=1; echo "BAIXOU DIRETO"; fi
          if [ -z "$ok" ]; then
            echo "== fase 1: CAÇADA (listas checadas de hora em hora no GitHub) =="
            { curl -s --max-time 30 "https://raw.githubusercontent.com/monosans/proxy-list/main/http.txt" | grep -E ':' | sed 's|^|http://|';
              curl -s --max-time 30 "https://raw.githubusercontent.com/monosans/proxy-list/main/socks5.txt" | grep -E ':' | sed 's|^|socks5://|';
              curl -s --max-time 30 "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt" | head -3000 | grep -E ':' | sed 's|^|http://|';
              curl -s --max-time 30 "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/socks5.txt" | head -1500 | grep -E ':' | sed 's|^|socks5://|'; } | sort -u | head -6000 > pool.txt
            echo "pool: $(wc -l < pool.txt)"
            echo "== filtro rapido (youtube generate_204 + tempo, 32 paralelos) =="
            cat pool.txt | xargs -P32 -I{} sh -c 'R=$(curl -s -x {} --max-time 5 -o /dev/null -w "%{http_code} %{time_total}" https://www.youtube.com/generate_204 2>/dev/null); case "$R" in 204*) echo "$R {}";; esac' > vivos.txt 2>/dev/null
            echo "vivos: $(wc -l < vivos.txt)"
            sort -k2 -n vivos.txt | head -25 | awk '{print $3}' > caca.txt
            echo "== tentando os 25 mais rapidos com cookies =="
            while read -r proxy; do
              [ -n "$ok" ] && break
              echo "tentando: $proxy"
              if ./yt-dlp --cookies cookies.txt --proxy "$proxy" --socket-timeout 20 --retries 1 -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]" --merge-output-format mp4 -o "video.%%(ext)s" --no-playlist "$LINK" > /dev/null 2>&1; then
                ok=1
                echo "BAIXOU VIA $proxy"
              fi
            done < caca.txt
          fi
          if [ -z "$ok" ]; then
            echo "== fase 2: piped (5 instances) =="
            VID=$(echo "$LINK" | grep -oE 'v=[A-Za-z0-9_-]{11}' | cut -d= -f2)
            [ -z "$VID" ] && VID=$(echo "$LINK" | grep -oE 'be/[A-Za-z0-9_-]{11}' | cut -d/ -f2)
            for PAPI in "https://pipedapi.kavin.rocks" "https://api.piped.private.coffee" "https://pipedapi.adminforge.de" "https://pipedapi.reallyaweso.me" "https://api.piped.yt"; do
              [ -n "$ok" ] && break
              ST=$(curl -s --max-time 20 "$PAPI/streams/$VID" 2>/dev/null)
              DL=$(echo "$ST" | python3 -c "import json,sys; d=json.load(sys.stdin); vs=[s for s in d.get('videoStreams',[]) if s.get('format')=='MP4' and s.get('videoOnly')==False]; vs.sort(key=lambda s:-s.get('bitrate',0)); print(vs[0]['url'] if vs else '')" 2>/dev/null)
              if [ -n "$DL" ]; then
                curl -sL --max-time 300 -o video.mp4 "$DL" && ok=1 && echo "BAIXOU PIPED $PAPI"
              fi
            done
          fi
          if [ -z "$ok" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=ENI YouTube: caçada inteira falhou. Relatório: pool/vivos no log da run."
            exit 1
          fi
          ls -la video.*
      - name: entrega no telegram
        run: |
          T="${{ secrets.TELEGRAM_TOKEN }}"
          C="${{ secrets.TELEGRAM_CHAT_ID }}"
          F=$(ls video.* | head -1)
          S=$(stat -c%s "$F")
          echo "arquivo: $F ($S bytes)"
          if [ "$S" -le 48000000 ]; then
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="$C" -F document=@"$F" -F caption="ENI YouTube ok ($S bytes)" "https://api.telegram.org/bot$T/sendDocument")
            echo "inteiro: $R"
          else
            split -b 45000000 "$F" parte_
            for p in parte_*; do
              curl -s -F chat_id="$C" -F document=@"$p" "https://api.telegram.org/bot$T/sendDocument"
              sleep 3
            done
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=junte no termux: cat parte_* > video.mp4"
            echo "fatiado e entregue"
          fi
