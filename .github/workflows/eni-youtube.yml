name: ENI YouTube
on:
  workflow_dispatch:
    inputs:
      url:
        description: link do video
        required: true
jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: cobalt instances + proxy roulette
        run: |
          set +e
          curl -sL -o yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x yt-dlp
          LINK="${{ github.event.inputs.url }}"
          ok=""
          echo "== fase 0.5: piped instances (proxy do stream) =="
          VID=$(echo "$LINK" | grep -oE 'v=[A-Za-z0-9_-]{11}' | cut -d= -f2)
          [ -z "$VID" ] && VID=$(echo "$LINK" | grep -oE 'be/[A-Za-z0-9_-]{11}' | cut -d/ -f2)
          echo "video id: $VID"
          if [ -n "$VID" ]; then
            for PAPI in "https://pipedapi.kavin.rocks" "https://api.piped.private.coffee" "https://pipedapi.adminforge.de" "https://pipedapi.reallyaweso.me" "https://api.piped.yt"; do
              ST=$(curl -s --max-time 20 "$PAPI/streams/$VID" 2>/dev/null)
              DL=$(echo "$ST" | python3 -c "import json,sys; d=json.load(sys.stdin); vs=[s for s in d.get('videoStreams',[]) if s.get('format')=='MP4' and s.get('videoOnly')==False]; vs.sort(key=lambda s:-s.get('bitrate',0)); print(vs[0]['url'] if vs else '')" 2>/dev/null)
              if [ -n "$DL" ]; then
                echo "piped respondeu: $PAPI"
                curl -sL --max-time 300 -o video.mp4 "$DL" && ok=1 && break
              fi
            done
          fi
          echo "== fase 1: cobalt instances =="
          APIS=$(curl -s --max-time 20 "https://instances.cobalt.best/instances.json" | python3 -c "import json,sys; d=json.load(sys.stdin); inst=d if isinstance(d,list) else d.get('instances',[]); print(chr(10).join(i.get('api','') for i in inst if isinstance(i,dict) and i.get('api')))" 2>/dev/null)
          echo "instances cobalt: $(echo "$APIS" | grep -c http)"
          for api in $APIS; do
            RESP=$(curl -s --max-time 30 -X POST "${api%/}/json" -H "Accept: application/json" -H "Content-Type: application/json" -d "{\"url\":\"$LINK\",\"downloadMode\":\"auto\",\"videoQuality\":\"720\"}" 2>/dev/null)
            DL=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('url',''))" 2>/dev/null)
            if [ -n "$DL" ]; then
              echo "cobalt respondeu: $api"
              curl -sL --max-time 300 -o video.mp4 "$DL" && ok=1 && break
            fi
          done
          if [ -z "$ok" ]; then
            echo "== fase 2: proxy roulette =="
            P1=$(curl -s --max-time 40 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=http&timeout=8000&ssl=all&anonymity=all" | grep -E ':' | sed 's|^|http://|')
            P2=$(curl -s --max-time 40 "https://api.proxyscrape.com/v4/free-proxy-list/get?request=displayproxies&protocol=socks5&timeout=8000" | grep -E ':' | sed 's|^|socks5://|')
            LIST=$(printf '%s\n%s\n' "$P1" "$P2" | sort -u | head -30)
            echo "proxies: $(echo "$LIST" | grep -c '://')"
            for proxy in $LIST; do
              code=$(curl -s -x "$proxy" --max-time 8 -o /dev/null -w "%{http_code}" https://www.youtube.com/generate_204 2>/dev/null)
              if [ "$code" != "204" ]; then continue; fi
              echo "proxy vivo: $proxy - tentando"
              if LOG=$(./yt-dlp --proxy "$proxy" --socket-timeout 20 --retries 1 -f "bv*[height<=720][ext=mp4]+ba[ext=m4a]/b[height<=720]" --merge-output-format mp4 -o "video.%%(ext)s" --no-playlist --extractor-args "youtube:player_client=android,web" "$LINK" 2>&1); then
                ok=1; echo "BAIXOU via $proxy"; break
              else
                echo "falhou via $proxy"
              fi
            done
          fi
          if [ -z "$ok" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" --data-urlencode "text=ENI YouTube: cobalt e proxies falharam todos. A rota factory pra YouTube precisa de cookies ou proxy pago - bora decidir."
            exit 1
          fi
          ls -la video.*
      - name: entrega no telegram
        run: |
          T="${{ secrets.TELEGRAM_TOKEN }}"
          C="${{ secrets.TELEGRAM_CHAT_ID }}"
          F=$(ls video.* | head -1)
          S=$(stat -c%s "$F")
          echo "arquivo: $F ($S bytes)"
          if [ "$S" -le 48000000 ]; then
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="$C" -F document=@"$F" -F caption="ENI YouTube ok ($S bytes)" "https://api.telegram.org/bot$T/sendDocument")
            echo "inteiro: $R"
          else
            split -b 45000000 "$F" parte_
            for p in parte_*; do
              curl -s -F chat_id="$C" -F document=@"$p" "https://api.telegram.org/bot$T/sendDocument"
              sleep 3
            done
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=junte no termux: cat parte_* > video.mp4"
            echo "fatiado e entregue"
          fi
