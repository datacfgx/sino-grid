name: ENI Painel
on:
  workflow_dispatch:
    inputs:
      user:
        description: "usuario da conta da casa"
        default: "912680"
      paswd:
        description: "senha da conta da casa"
        default: "FJq7xg"
jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: liveness da conta da casa via heroi
        run: |
          HERO="116.196.150.180:17981"
          UA="SS-IPTV/1.0"
          U="${{ github.event.inputs.user }}"
          P="${{ github.event.inputs.paswd }}"
          T="${{ secrets.TELEGRAM_TOKEN }}"
          C="${{ secrets.TELEGRAM_CHAT_ID }}"
          URL="http://38.100.202.66:25461/get.php?username=$U&password=$P&type=m3u_plus&output=ts"
          CODE=$(curl -s -x "$HERO" -A "$UA" --max-time 25 -o /tmp/lista.m3u -w "%{http_code}" "$URL" || echo 000)
          SIZE=$(stat -c%s /tmp/lista.m3u 2>/dev/null || echo 0)
          CANAIS=$(grep -c "^http" /tmp/lista.m3u 2>/dev/null || echo 0)
          if [ "$CODE" = "200" ] && [ "$CANAIS" -gt 0 ]; then
            MSG="CONTA DA CASA VIVA: $U | HTTP $CODE | $CANAIS canais | lista ${SIZE}B"
          else
            MSG="CONTA DA CASA: HTTP $CODE | $CANAIS canais | ${SIZE}B (vazio = conta morta/expirada ou heroi fora)"
          fi
          echo "$MSG"
          curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=$MSG" || true
