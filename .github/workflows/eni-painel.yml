name: ENI Painel
on:
  workflow_dispatch:
    inputs:
      user:
        description: "usuario da conta da casa"
        default: "912680"
      paswd:
        description: "senha da conta da casa"
        default: "FJq7xg"
jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: liveness da conta da casa via heroi
        run: |
          HERO="116.196.150.180:17981"
          UA="SS-IPTV/1.0"
          U="${{ github.event.inputs.user }}"
          P="${{ github.event.inputs.paswd }}"
          T="${{ secrets.TELEGRAM_TOKEN }}"
          C="${{ secrets.TELEGRAM_CHAT_ID }}"
          URL="http://38.100.202.66:25461/get.php?username=$U&password=$P&type=m3u_plus&output=ts"
          # 1) painel direto (sem heroi)
          CD=$(curl -s -A "$UA" --max-time 20 -o /tmp/d.m3u -w "%{http_code}" "$URL" || echo 000)
          ND=$(grep -c "^http" /tmp/d.m3u 2>/dev/null || echo 0)
          # 2) heroi vivo? (atraves dele, site neutro)
          CH=$(curl -s -x "$HERO" --max-time 15 -o /dev/null -w "%{http_code}" http://example.com || echo 000)
          # 3) painel via heroi
          CV=$(curl -s -x "$HERO" -A "$UA" --max-time 25 -o /tmp/h.m3u -w "%{http_code}" "$URL" || echo 000)
          NV=$(grep -c "^http" /tmp/h.m3u 2>/dev/null || echo 0)
          MSG="PAINEL: direto HTTP $CD ($ND canais) | heroi HTTP $CH (exemplo.com) | via heroi HTTP $CV ($NV canais) | conta $U"
          if [ "$ND" -gt 0 ] || [ "$NV" -gt 0 ]; then
            MSG="CONTA DA CASA VIVA: $U | direto $CD/$ND canais | via heroi $CV/$NV canais"
          fi
          echo "$MSG"
          curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=$MSG" || true
