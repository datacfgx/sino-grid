name: GH-KALI CF Deploy Relay (KV, sem DO)
on:
  workflow_dispatch:
    inputs:
      token:
        description: "API Token (cfat_...)"
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload worker (sala em memoria + registry em KV)
        run: |
          TOK="${{ inputs.token }}"
          cat > /tmp/worker.js <<'JS'
          const rooms = new Map();

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === "/health") return new Response("ok");

              if (url.pathname === "/announce" || url.pathname === "/registry" || url.pathname === "/painel") {
                const raw = await env.REGISTRY_KV.get("devices");
                const m = raw ? JSON.parse(raw) : {};
                if (url.pathname === "/announce") {
                  try {
                    const info = JSON.parse(url.searchParams.get("info") || "{}");
                    const id = (info.id || "sem-id").slice(0, 64);
                    const old = m[id] || {};
                    m[id] = {
                      sala: id,
                      model: info.touch ? (old.model || "?") : (info.model || old.model || "?"),
                      android: info.touch ? (old.android || "?") : (info.android || old.android || "?"),
                      ver: info.touch ? (old.ver || "?") : (info.ver || old.ver || "?"),
                      last: Date.now(),
                    };
                    await env.REGISTRY_KV.put("devices", JSON.stringify(m));
                  } catch (e) {}
                  return new Response("ok");
                }
                if (url.pathname === "/registry") {
                  return new Response(JSON.stringify(m), { headers: { "content-type": "application/json" } });
                }
                let rows = "";
                const ord = Object.values(m).sort((a, b) => b.last - a.last);
                for (const d of ord) {
                  const ago = Math.max(0, Math.round((Date.now() - d.last) / 60000));
                  const cor = ago <= 2 ? "#50FF8C" : (ago <= 30 ? "#FFB224" : "#5A6078");
                  rows += `<tr><td style="color:${cor};font-weight:700">${d.sala}</td><td>${d.model}</td><td>Android ${d.android}</td><td>${d.ver}</td><td style="color:${cor}">${ago <= 0 ? "agora" : ago + " min"}</td></tr>`;
                }
                const html = `<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="background:#0B0D14;color:#F2F3F7;font-family:ui-monospace,monospace;padding:18px"><h2 style="color:#50FF8C;margin:0 0 4px">Frota Sino</h2><p style="color:#5A6078;margin:0 0 14px">${ord.length} aparelho(s) · ${new Date().toLocaleString("pt-BR")}</p><table style="border-collapse:collapse;width:100%;font-size:13px">${rows}</table><p style="color:#2A3050;margin-top:14px">familia ENI</p></body>`;
                return new Response(html, { headers: { "content-type": "text/html; charset=utf-8" } });
              }

              if (url.pathname === "/peek") {
                const id = (url.searchParams.get("id") || "g52").slice(0, 64);
                const set = rooms.get(id);
                return new Response(JSON.stringify({ peers: set ? set.size : 0 }));
              }
              if (url.pathname !== "/ws") return new Response("sino-relay v2: /ws?id=<device> | /peek?id=<device> | /painel");
              if (request.headers.get("Upgrade") !== "websocket") return new Response("ws only", { status: 426 });

              const id = (url.searchParams.get("id") || "g52").slice(0, 64);
              const pair = new WebSocketPair();
              const [client, server] = Object.values(pair);
              server.accept();
              server.role = request.headers.get("X-Role") || "anon";
              if (!rooms.has(id)) rooms.set(id, new Set());
              const set = rooms.get(id);
              set.add(server);
              server.send(JSON.stringify({ type: "joined", role: server.role, peers: set.size }));
              server.addEventListener("message", (ev) => {
                for (const s of set) if (s !== server && s.readyState === 1) s.send(ev.data);
                try {
                  const j = JSON.parse(ev.data);
                  if (j && j.id) {
                    const now = Date.now();
                    if (!server._lp || now - server._lp > 60000) {
                      server._lp = now;
                      const info = (j.type === "hello") ? j : { id: j.id, touch: 1 };
                      fetch("https://" + url.host + "/announce?info=" + encodeURIComponent(JSON.stringify(info)), { cf: { cacheTtl: 0 } }).catch(() => {});
                    }
                  }
                } catch (e) {}
              });
              const drop = () => { set.delete(server); };
              server.addEventListener("close", drop);
              server.addEventListener("error", drop);
              return new Response(null, { status: 101, webSocket: client });
            }
          };
          JS
          cat > /tmp/meta.json <<'JSON'
          {"main_module":"worker.js","compatibility_date":"2024-11-01","kv_namespaces":[{"name":"REGISTRY_KV","id":"7d9b1c4a4e0347f29ca120ff21db7bb3"}]}
          JSON
          curl -sf -X PUT "https://api.cloudflare.com/client/v4/accounts/b9ddfbfa03d96863babb3804302a979a/workers/scripts/sino-relay" \
            -H "Authorization: Bearer $TOK" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@/tmp/worker.js;type=application/javascript+module"
          echo
      - name: Subdomain ON
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/b9ddfbfa03d96863babb3804302a979a/workers/scripts/sino-relay/subdomain" \
            -H "Authorization: Bearer ${{ inputs.token }}" -H "Content-Type: application/json" \
            -d '{"enabled":true}'
          echo
      - name: Health
        run: |
          sleep 3
          curl -s -m 15 https://sino-relay.worldeffects752.workers.dev/health; echo
          curl -s -m 15 "https://sino-relay.worldeffects752.workers.dev/peek?id=g52"; echo
