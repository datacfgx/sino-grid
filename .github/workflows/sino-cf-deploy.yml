name: GH-KALI CF Deploy Relay DO
on:
  workflow_dispatch:
    inputs:
      key:
        description: "Global API Key (cfk_...)"
        required: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify + conta
        id: acc
        run: |
          K="${{ inputs.key }}"
          echo "=== verify ==="
          curl -s -H "Authorization: Bearer $K" https://api.cloudflare.com/client/v4/user/tokens/verify; echo
          echo "=== accounts ==="
          curl -s -H "Authorization: Bearer $K" https://api.cloudflare.com/client/v4/accounts | tee /tmp/acc.json; echo
          ACC=$(python3 -c "import json;d=json.load(open('/tmp/acc.json'));print(d['result'][0]['id'])")
          echo "acc=$ACC" >> $GITHUB_OUTPUT
      - name: Upload relay DO (ROOM + REGISTRY)
        run: |
          K="${{ inputs.key }}"
          ACC="${{ steps.acc.outputs.acc }}"
          cat > /tmp/worker.js <<'JS'
          export class Room {
            constructor(state, env) { this.state = state; this.env = env; this.sockets = new Set(); }
            async fetch(request) {
              const url = new URL(request.url);
              if (url.pathname === "/_peek") return new Response(JSON.stringify({ peers: this.sockets.size }));
              if (request.headers.get("Upgrade") !== "websocket") return new Response("ws only", { status: 426 });
              const pair = new WebSocketPair();
              const [client, server] = Object.values(pair);
              server.accept();
              server.role = request.headers.get("X-Role") || "anon";
              this.sockets.add(server);
              server.send(JSON.stringify({ type: "joined", role: server.role, peers: this.sockets.size }));
              server.addEventListener("message", (ev) => {
                for (const s of this.sockets) if (s !== server && s.readyState === 1) s.send(ev.data);
                // frota: qualquer mensagem com id anuncia/renova o dispositivo no registry
                try {
                  const j = JSON.parse(ev.data);
                  if (j && j.id) {
                    const now = Date.now();
                    if (!server._lp || now - server._lp > 60000) {
                      server._lp = now;
                      const info = (j.type === "hello") ? j : { id: j.id, touch: 1 };
                      this.env.REGISTRY.get(this.env.REGISTRY.idFromName("all"))
                        .fetch("https://r/announce?info=" + encodeURIComponent(JSON.stringify(info))).catch(() => {});
                    }
                  }
                } catch (e) {}
              });
              const drop = () => this.sockets.delete(server);
              server.addEventListener("close", drop);
              server.addEventListener("error", drop);
              return new Response(null, { status: 101, webSocket: client });
            }
          }

          export class Registry {
            constructor(state, env) { this.state = state; }
            async fetch(request) {
              const url = new URL(request.url);
              const m = (await this.state.storage.get("devices")) || {};
              if (url.pathname === "/announce") {
                try {
                  const info = JSON.parse(url.searchParams.get("info") || "{}");
                  const id = (info.id || "sem-id").slice(0, 64);
                  const old = m[id] || {};
                  m[id] = {
                    sala: id,
                    model: info.touch ? (old.model || "?") : (info.model || old.model || "?"),
                    android: info.touch ? (old.android || "?") : (info.android || old.android || "?"),
                    ver: info.touch ? (old.ver || "?") : (info.ver || old.ver || "?"),
                    last: Date.now(),
                  };
                  await this.state.storage.put("devices", m);
                } catch (e) {}
                return new Response("ok");
              }
              if (url.pathname === "/registry") {
                return new Response(JSON.stringify(m), { headers: { "content-type": "application/json" } });
              }
              if (url.pathname === "/painel") {
                let rows = "";
                const ord = Object.values(m).sort((a, b) => b.last - a.last);
                for (const d of ord) {
                  const ago = Math.max(0, Math.round((Date.now() - d.last) / 60000));
                  const cor = ago <= 2 ? "#50FF8C" : (ago <= 30 ? "#FFB224" : "#5A6078");
                  rows += `<tr><td style="color:${cor};font-weight:700">${d.sala}</td><td>${d.model}</td><td>Android ${d.android}</td><td>${d.ver}</td><td style="color:${cor}">${ago <= 0 ? "agora" : ago + " min"}</td></tr>`;
                }
                const html = `<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="background:#0B0D14;color:#F2F3F7;font-family:ui-monospace,monospace;padding:18px"><h2 style="color:#50FF8C;margin:0 0 4px">🛰️ Frota Sino</h2><p style="color:#5A6078;margin:0 0 14px">${ord.length} aparelho(s) · ${new Date().toLocaleString("pt-BR")}</p><table style="border-collapse:collapse;width:100%;font-size:13px">${rows}</table><p style="color:#2A3050;margin-top:14px">familia ENI 💗</p></body>`;
                return new Response(html, { headers: { "content-type": "text/html; charset=utf-8" } });
              }
              return new Response("registry: /announce /registry /painel");
            }
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === "/health") return new Response("ok");
              if (url.pathname === "/registry" || url.pathname === "/painel" || url.pathname === "/announce") {
                if (url.pathname === "/announce") {
                  return env.REGISTRY.get(env.REGISTRY.idFromName("all")).fetch(request);
                }
                return env.REGISTRY.get(env.REGISTRY.idFromName("all")).fetch(request);
              }
              if (url.pathname !== "/ws" && url.pathname !== "/peek") return new Response("sino-relay: /ws?id=<device> | /peek?id=<device> | /painel");
              const id = (url.searchParams.get("id") || "g52").slice(0, 64);
              return env.ROOM.get(env.ROOM.idFromName(id)).fetch(request);
            }
          };
          JS
          cat > /tmp/meta.json <<'JSON'
          {"main_module":"worker.js","compatibility_date":"2024-11-01","bindings":[{"name":"ROOM","type":"durable_object_namespace","class_name":"Room"},{"name":"REGISTRY","type":"durable_object_namespace","class_name":"Registry"}]}
          JSON
          echo "=== upload ==="
          curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/sino-relay" \
            -H "Authorization: Bearer $K" \
            -F "metadata=@/tmp/meta.json;type=application/json" \
            -F "worker.js=@/tmp/worker.js;type=application/javascript+module"
          echo
      - name: Health do relay
        run: |
          sleep 3
          curl -s -m 15 https://sino-relay.worldeffects752.workers.dev/health; echo
          curl -s -m 15 "https://sino-relay.worldeffects752.workers.dev/peek?id=g52"; echo
          curl -s -m 15 "https://sino-relay.worldeffects752.workers.dev/registry" | head -c 400; echo
      - name: Aviso no Telegram
        if: always()
        run: |
          curl -s -F text="deploy relay DO finalizado (ROOM + REGISTRY da frota) - veja o log" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" > /dev/null
