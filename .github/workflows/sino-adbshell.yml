name: GH-KALI ADB Shell Remoto
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP Tailscale do G52 (100.x.y.z)"
        required: true
      porta_par:
        description: "Porta do dialog de pareamento"
        required: true
      codigo:
        description: "Codigo de 6 digitos"
        required: true
      porta_con:
        description: "Porta de conexao (ou SCAN)"
        required: true
permissions:
  contents: read
jobs:
  adb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: platform-tools 33.0.3
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
          /tmp/platform-tools/adb --version
      - name: Aguarda o servico de pareamento abrir
        timeout-minutes: 5
        run: |
          echo "aguardando ${{ inputs.alvo }}:${{ inputs.porta_par }} aceitar TCP..."
          for i in $(seq 1 60); do
            if nc -z -w2 ${{ inputs.alvo }} ${{ inputs.porta_par }} 2>/dev/null; then
              echo "PORTA ABERTA (tentativa $i)"; exit 0
            fi
            sleep 5
          done
          echo "porta nunca abriu"; exit 1
      - name: Parear (imediato)
        run: |
          A=/tmp/platform-tools/adb
          for tent in 1 2 3; do
            echo "=== tentativa $tent ==="
            echo '${{ inputs.codigo }}' | $A pair ${{ inputs.alvo }}:${{ inputs.porta_par }} && break
            sleep 3
          done
      - name: Descobre porta de conexao
        if: ${{ inputs.porta_con == 'SCAN' }}
        run: |
          PORT=$(seq 30000 50000 | xargs -P 300 -I{} sh -c 'nc -z -w1 ${{ inputs.alvo }} {} 2>/dev/null && echo {}' | head -1)
          echo "PORTA_DETECTADA=$PORT" >> $GITHUB_ENV
          echo "detectada: $PORT"
      - name: Conecta e testa como shell
        run: |
          set -x
          A=/tmp/platform-tools/adb
          P="${{ inputs.porta_con }}"
          if [ "$P" = "SCAN" ]; then P="$PORTA_DETECTADA"; fi
          for tent in 1 2 3 4 5; do
            $A connect ${{ inputs.alvo }}:$P && break
            sleep 3
          done
          $A devices
          $A shell id
          $A shell cat /proc/self/attr/current
          $A push tools/hello_arm64 /data/local/tmp/hello
          $A shell chmod 700 /data/local/tmp/hello
          $A shell /data/local/tmp/hello
          $A shell rm -f /data/local/tmp/hello
      - name: Aviso no Telegram
        if: always()
        run: |
          curl -s -F text="runner adb remoto finalizado — veja o log da run" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" > /dev/null
