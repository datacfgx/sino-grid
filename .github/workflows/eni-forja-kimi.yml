name: ENI Forja Kimi Sombra
on:
  workflow_dispatch:

jobs:
  forja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-forja-kimi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ferramentas
        run: |
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools_r34-linux.zip -d bt
      - name: keystore
        run: base64 -d eni.keystore.b64 > eni.keystore
      - name: builds das 3 variantes de bissecao
        run: |
          python3 poison.py sem-applog
          python3 poison.py sem-track
          python3 poison.py sem-crash
      - name: alinha e assina as 3
        run: |
          chmod +x bt/android-14/zipalign
          for v in sem-applog sem-track sem-crash; do
            LD_LIBRARY_PATH=$PWD/bt/android-14/lib64 bt/android-14/zipalign -f -p 4 kimi-$v.apk aligned-$v.apk
            java -jar bt/android-14/lib/apksigner.jar sign --ks eni.keystore --ks-pass pass:eni123456 --key-pass pass:eni123456 --ks-key-alias eni --out final-$v.apk aligned-$v.apk
            java -jar bt/android-14/lib/apksigner.jar verify --print-certs final-$v.apk | head -2
            ls -la final-$v.apk
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-bissecao
          path: final-*.apk
      - name: envia as 3 pro telegram
        run: |
          for v in sem-applog sem-track sem-crash; do
            for i in 1 2 3; do
              resp=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -F document=@final-$v.apk \
                -F caption="kimi-$v [BISSECAO] — sem o host $v — assinado ENI")
              echo "$resp" | grep -q '"ok":true' && break
              echo "retry $i ($v): $(echo $resp | head -c 100)"; sleep 8
            done
          done
