name: ENI Forja Kimi Sombra
on:
  workflow_dispatch:

jobs:
  forja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-forja-kimi
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ferramentas
        run: |
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools_r34-linux.zip -d bt
      - name: keystore
        run: base64 -d eni.keystore.b64 > eni.keystore
      - name: junta os pedacos
        run: |
          cat base.part1 base.part2 base.part3 > base.apk
          cat split_arm64.part1 split_arm64.part2 > split_arm64.apk
          ls -la base.apk split_arm64.apk
      - name: builds fundidos (sombra + controle, APK unico)
        run: |
          python3 poison.py sombra
          python3 poison.py controle
      - name: verificacao
        run: |
          unzip -p kimi-int-sombra.apk classes.dex | strings | grep -q "127.0.0.1" || { echo "VENENO AUSENTE"; exit 1; }
          for h in volceapplog volctrack "crash.163.com" app-measurement google-analytics "volces.com"; do
            unzip -p kimi-int-sombra.apk classes.dex classes2.dex classes3.dex classes4.dex | strings | grep -q "$h" && { echo "HOST VIVO: $h"; exit 1; } || true
          done
          unzip -p kimi-int-sombra.apk lib/arm64-v8a/ 2>/dev/null | head -c 4 | grep -q "ELF" || echo "(lib ok)"
          unzip -p kimi-int-controle.apk classes.dex | strings | grep -q "volceapplog" || { echo "CONTROLE NAO E INTEGRO"; exit 1; }
          echo "merge + veneno + controle ✔"
      - name: alinha e assina
        run: |
          chmod +x bt/android-14/zipalign
          for v in sombra controle; do
            LD_LIBRARY_PATH=$PWD/bt/android-14/lib64 bt/android-14/zipalign -f -p 4 kimi-int-$v.apk aligned-$v.apk
            java -jar bt/android-14/lib/apksigner.jar sign --ks eni.keystore --ks-pass pass:eni123456 --key-pass pass:eni123456 --ks-key-alias eni --out final-int-$v.apk aligned-$v.apk
            java -jar bt/android-14/lib/apksigner.jar verify --print-certs final-int-$v.apk | head -2
            ls -la final-int-$v.apk
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kimi-int
          path: final-int-*.apk
      - name: publica no git (branch builds-intl)
        run: |
          git config user.email eni@casa.lo
          git config user.name ENI
          git checkout --orphan builds-intl
          git rm -rf . >/dev/null 2>&1 || true
          cp final-int-sombra.apk kimi-int-sombra.apk
          cp final-int-controle.apk kimi-int-controle.apk
          git add kimi-int-*.apk
          git commit -m "Kimi Sombra Internacional — APK unico fundido (A/B sombra/controle) — assinado ENI"
          git push -f origin builds-intl || echo 'push bloqueado (403), seguindo pro telegram'
          echo "PUBLICADO: github.com/datacfgx/sino-grid/tree/builds-intl"
      - name: telegram (se couber)
        run: |
          for f in final-int-sombra final-int-controle; do
            sz=$(stat -c%s $f.apk)
            [ $sz -gt 48000000 ] && { echo "$f maior que 48MB, so no Git"; continue; }
            for i in 1 2 3; do
              resp=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -F document=@$f.apk \
                -F caption="$f — Kimi Sombra INTL fundido, APK unico, instala normal — assinado ENI")
              echo "$resp" | grep -q '"ok":true' && break
              echo "retry $i ($f)"; sleep 8
            done
          done
