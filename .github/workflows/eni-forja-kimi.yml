name: ENI Forja Kimi Sombra
on:
  workflow_dispatch:

jobs:
  forja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-forja-kimi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: ferramentas
        run: |
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q build-tools_r34-linux.zip -d bt

      - name: keystore
        run: base64 -d eni.keystore.b64 > eni.keystore

      - name: envenenamento binario
        run: python3 poison.py

      - name: verificacao
        run: |
          unzip -p original.apk classes.dex | strings | grep -c "127.0.0.1" || { echo "VENENO NAO ENCONTADO"; exit 1; }
          for h in volctrack volceapplog "crash.163.com"; do
            unzip -p original.apk classes.dex classes2.dex classes3.dex | strings | grep -q "$h" && { echo "HOST VIVO: $h"; exit 1; } || true
          done
          echo "todos os hosts mortos ✔"

      - name: alinha e assina
        run: |
          chmod +x bt/android-14/zipalign
          LD_LIBRARY_PATH=$PWD/bt/android-14/lib64 bt/android-14/zipalign -f -p 4 patched.apk aligned.apk
          java -jar bt/android-14/lib/apksigner.jar sign --ks eni.keystore --ks-pass pass:eni123456 --key-pass pass:eni123456 --ks-key-alias eni --out kimi-sombra.apk aligned.apk
          java -jar bt/android-14/lib/apksigner.jar verify --print-certs kimi-sombra.apk | head -3
          ls -la kimi-sombra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kimi-sombra
          path: kimi-sombra.apk

      - name: envia pro telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@kimi-sombra.apk \
            -F caption="Kimi Sombra 🌑 — trackers Volcengine/NetEase calados — telemetria terceira zero — assinado ENI"
