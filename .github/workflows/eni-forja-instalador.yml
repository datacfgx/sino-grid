name: ENI Forja Instalador
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-inbox
      - name: sdk + forja + entrega
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
          mkdir -p sdk && unzip -q build-tools_r34-linux.zip -d sdk
          wget -q https://dl.google.com/android/repository/platform-34_r03.zip
          mkdir -p plat && unzip -q platform-34_r03.zip -d plat
          cp -r sdk/android-14 instalador/bt
          cp plat/android-14/android.jar instalador/android.jar
          base64 -d eni.keystore.b64 > instalador/eni.keystore
          cd instalador
          sh build.sh
          echo "== entrega =="
          curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F document=@eni-instalador-xapk.apk \
            -F caption="ENI Instalador XAPK v1 - assinado pela casa. Instale uma vez e abra .xapk com ele." \
            https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument
