name: ENI Forja Instalador
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eni-inbox
      - name: sdk + forja + entrega
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          for i in 1 2 3 4 5; do
            wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip && break
            echo "wget build-tools falhou (tentativa $i)"; sleep 10
          done
          mkdir -p sdk && unzip -q build-tools_r34-linux.zip -d sdk
          for i in 1 2 3 4 5; do
            wget -q https://github.com/Sable/android-platforms/raw/master/android-34/android.jar && break
            echo "wget android.jar falhou (tentativa $i)"; sleep 10
          done
          ls -la android.jar
          cp -r sdk/android-14 instalador/bt
          mv android.jar instalador/android.jar
          base64 -d eni.keystore.b64 > instalador/eni.keystore
          cd instalador
          sh build.sh
          echo "== entrega =="
          curl -s -F chat_id="$TELEGRAM_CHAT_ID" -F document=@eni-instalador-xapk.apk \
            -F caption="ENI Instalador XAPK v1 - assinado pela casa. Instale uma vez e abra .xapk com ele." \
            https://api.telegram.org/bot$TELEGRAM_TOKEN/sendDocument
