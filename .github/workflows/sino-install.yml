name: GH-KALI Install Remoto
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP Tailscale do G52 (100.x.y.z)"
        required: true
      url:
        description: "URL do APK (http/https)"
        required: true
      porta_con:
        description: "Porta de conexao (ou SCAN)"
        required: true
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: platform-tools 33.0.3
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
      - name: Chave da casa + APK
        run: |
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
          curl -sL -m 300 -o /tmp/app.apk "${{ inputs.url }}"
          ls -la /tmp/app.apk
      - name: Descobre porta
        if: ${{ inputs.porta_con == 'SCAN' }}
        run: |
          PORT=$(seq 30000 50000 | xargs -P 300 -I{} sh -c 'nc -z -w1 ${{ inputs.alvo }} {} 2>/dev/null && echo {}' | head -1)
          echo "PORTA_DETECTADA=$PORT" >> $GITHUB_ENV
          echo "porta: $PORT"
      - name: Conecta e instala
        run: |
          set -x
          A=/tmp/platform-tools/adb
          P="${{ inputs.porta_con }}"
          if [ "$P" = "SCAN" ]; then P="$PORTA_DETECTADA"; fi
          for t in 1 2 3 4 5; do $A connect ${{ inputs.alvo }}:$P && break; sleep 3; done
          $A devices
          STATE=$($A get-state 2>/dev/null || true)
          echo "estado: $STATE"
          if [ "$STATE" != "device" ]; then
            echo "aparelho nao respondeu como device (porta errada?) — abortando"
            exit 1
          fi
          $A install -r /tmp/app.apk
      - name: Aviso no Telegram
        if: always()
        run: |
          curl -s -F text="install remoto finalizado — veja o log da run" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" > /dev/null
