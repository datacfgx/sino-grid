name: ABLOY Build
on:
  workflow_dispatch:
  push:
    paths: ["apps/abloy/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/abloy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: abloy-debug-apk
          path: apps/abloy/app/build/outputs/apk/debug/*.apk
