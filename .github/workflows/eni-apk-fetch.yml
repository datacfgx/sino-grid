name: ENI APK Fetch
on:
  workflow_dispatch:
    inputs:
      package:
        description: "package id do app (ex: com.lemon.lvoverseas)"
        default: "com.lemon.lvoverseas"
      slug:
        description: "nome legivel do app (ex: capcut)"
        default: "capcut"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: cacar fonte (apkcombo -> apkmonk -> apkpure)
        run: |
          python3 << 'PY'
          import urllib.request, re, sys, datetime

          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"}
          pkg, slug = "${{ inputs.package }}", "${{ inputs.slug }}"

          def get(url, ref=None):
              h = dict(UA)
              if ref: h["Referer"] = ref
              return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=35).read().decode("utf-8", "replace")

          def rank(links, ctx):
              nota = 0
              c = ctx.lower()
              if ".apk" in c and not any(x in c for x in (".xapk", ".apks", ".apkm", "bundle")): nota += 3
              if "arm64-v8a" in c: nota += 2
              if "universal" in c or "nodpi" in c: nota += 1
              return nota

          fontes = [
              ("apkcombo", f"https://apkcombo.com/{slug}/{pkg}/download/apk",
                            r'href="(https://download\.apkcombo\.com/[^"]+)"'),
              ("apkmonk",  f"https://www.apkmonk.com/app/{pkg}/",
                            r'"(https://cdn\.apkmonk\.com/[^"]+\.apk[^"]*)"'),
              ("apkpure",  f"https://apkpure.com/{slug}/{pkg}/download",
                            r'"(https://d\.apkpure\.com/[^"]+)"'),
          ]

          achou = None
          for nome, url, rx in fontes:
              print(f"== tentando {nome}: {url}")
              try:
                  page = get(url)
              except Exception as e:
                  print(f"   falhou abrir: {e}")
                  continue
              cands = []
              for m in re.finditer(rx, page):
                  l = m.group(1).replace("&amp;", "&")
                  ctx = page[max(0, m.start()-300):m.end()+300]
                  cands.append((rank([l], ctx), l))
              cands = [c for c in cands if c[0] > 0]
              cands.sort(reverse=True)
              if cands:
                  achou = (nome, cands[0][1])
                  break
              print("   sem link candidato")

          if not achou:
              sys.exit("todas as fontes falharam")
          nome, link = achou
          vers = datetime.datetime.now().strftime("%Y%m%d") + "-" + nome
          open("/tmp/dl.txt", "w").write(link)
          open("/tmp/vers.txt", "w").write(vers)
          print("FONTE:", nome)
          print("VERSAO:", vers)
          print("DIRETO:", link)
          PY

      - name: baixar e conferir
        run: |
          set -e
          DL=$(cat /tmp/dl.txt)
          curl -sSL --retry 3 -A "Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile Safari/537.36" -o app.apk "$DL"
          python3 - << 'PY'
          import os, sys
          sz = os.path.getsize("app.apk")
          with open("app.apk", "rb") as f: magic = f.read(2)
          print("tamanho:", sz, "magic:", magic)
          if magic != b"PK" or sz < 20_000_000:
              sys.exit("arquivo invalido (nao eh APK ou pequeno demais)")
          PY

      - name: fatiar e publicar no branch apk-parts
        run: |
          set -e
          V=$(cat /tmp/vers.txt)
          APP="${{ inputs.slug }}"
          mkdir -p /tmp/out
          split -b 45M -d -a 2 app.apk /tmp/out/parte_
          sha256sum app.apk > /tmp/out/sha256.txt
          echo "fonte: $(cat /tmp/dl.txt)" > /tmp/out/fonte.txt
          git config user.email "eni@fabrica.local"
          git config user.name "eni-fabrica"
          git fetch origin apk-parts && git checkout -f -B apk-parts origin/apk-parts || { git checkout --orphan apk-parts && git rm -rf . > /dev/null 2>&1; }
          rm -rf "$APP" && mkdir -p "$APP/$V"
          mv /tmp/out/* "$APP/$V"/
          git add -A
          git commit -m "apk fetch: $APP $V (oficial, limpo)"
          git push -f origin apk-parts
          echo "PUBLICADO em apk-parts/$APP/$V/"
          ls -lh "$APP/$V"/
