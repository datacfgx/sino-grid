name: ENI APK Fetch
on:
  workflow_dispatch:
    inputs:
      package:
        description: "package id do app (ex: com.lemon.lvoverseas)"
        default: "com.lemon.lvoverseas"
      slug:
        description: "nome legivel do app (ex: capcut)"
        default: "capcut"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: cacar fonte (apkpure -> uptodown)
        run: |
          python3 << 'PY'
          import urllib.request, re, sys, datetime

          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"}
          pkg, slug = "${{ inputs.package }}", "${{ inputs.slug }}"

          def get(url, ref=None):
              h = dict(UA)
              if ref: h["Referer"] = ref
              return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=35).read().decode("utf-8", "replace")

          def rank(link, ctx):
              c = ctx.lower(); l = link.lower(); nota = 0
              if pkg in l: nota += 10
              if "d.apkpure.com/b/apk/" in l: nota += 4
              if "d.apkpure.com/b/xapk/" in l: nota += 2
              if "custom" in l or "aegon" in l or "installer" in c: nota -= 10
              if ".xapk" in l: nota += 0
              elif ".apk" in l: nota += 2
              if any(x in l for x in (".apkm", ".apks")): nota -= 5
              return nota

          fontes = [
              ("apkpure",  f"https://apkpure.com/{slug}/{pkg}/download",
                            r'"(https://d\.apkpure\.com/[^"]+)"'),
              ("uptodown", f"https://{slug}.en.uptodown.com/android/download",
                            r'"(https://dw\.uptodown\.com/[^"]+)"'),
          ]

          achou = None
          for nome, url, rx in fontes:
              print(f"== tentando {nome}: {url}")
              try:
                  page = get(url)
              except Exception as e:
                  print(f"   falhou abrir: {e}")
                  continue
              cands = []
              for m in re.finditer(rx, page):
                  l = m.group(1).replace("&amp;", "&")
                  ctx = page[max(0, m.start()-300):m.end()+300]
                  s = rank(l, ctx)
                  print(f"   cand nota={s} {l[:110]}")
                  cands.append((s, l))
              cands.sort(reverse=True)
              cands = [c for c in cands if c[0] >= 8]
              if cands:
                  achou = (nome, cands[0][1])
                  break

          if not achou:
              sys.exit("todas as fontes falharam")
          nome, link = achou
          ext = "xapk" if ".xapk" in link.lower() else "apk"
          vers = datetime.datetime.now().strftime("%Y%m%d") + "-" + nome
          open("/tmp/dl.txt", "w").write(link)
          open("/tmp/vers.txt", "w").write(vers)
          open("/tmp/ext.txt", "w").write(ext)
          print("FONTE:", nome)
          print("VERSAO:", vers)
          print("EXT:", ext)
          print("DIRETO:", link)
          PY

      - name: baixar e conferir
        run: |
          set -e
          EXT=$(cat /tmp/ext.txt)
          DL=$(cat /tmp/dl.txt)
          curl -sSL --retry 3 -A "Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile Safari/537.36" -e "https://apkpure.com/" -o "app.$EXT" "$DL"
          python3 - << 'PY'
          import os, sys, glob
          f = glob.glob("app.*")[0]
          sz = os.path.getsize(f)
          with open(f, "rb") as fh: magic = fh.read(2)
          print("arquivo:", f, "tamanho:", sz, "magic:", magic)
          if magic != b"PK" or sz < 20_000_000:
              sys.exit("arquivo invalido (nao eh zip/APK ou pequeno demais)")
          PY

      - name: fatiar e publicar no branch apk-parts
        run: |
          set -e
          V=$(cat /tmp/vers.txt)
          EXT=$(cat /tmp/ext.txt)
          APP="${{ inputs.slug }}"
          mkdir -p /tmp/out
          split -b 45M -d -a 2 "app.$EXT" /tmp/out/parte_
          sha256sum "app.$EXT" > /tmp/out/sha256.txt
          echo "fonte: $(cat /tmp/dl.txt)" > /tmp/out/fonte.txt
          echo "ext: $EXT" > /tmp/out/ext.txt
          TAG="apk-$APP-$V"
          GH="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          API="https://api.github.com/repos/${{ github.repository }}"
          curl -s -X DELETE -H "$GH" "$API/releases/tags/$TAG" > /dev/null 2>&1 || true
          REL=$(curl -s -X POST -H "$GH" -H "Accept: application/vnd.github+json" "$API/releases" -d "{\"tag_name\":\"$TAG\",\"name\":\"$APP oficial limpo ($V)\",\"body\":\"fonte: $(cat /tmp/dl.txt)\\nsha256: $(cut -d' ' -f1 /tmp/out/sha256.txt) — junta as partes do branch apk-parts se preferir\\ncat parte_* > $APP.$EXT\"}")
          REL_ID=$(echo "$REL" | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "release id: $REL_ID"
          curl -s -X POST -H "$GH" -H "Content-Type: application/octet-stream" --data-binary @"app.$EXT" "https://uploads.github.com/repos/${{ github.repository }}/releases/$REL_ID/assets?name=$APP.$EXT" | python3 -c "import sys,json;d=json.load(sys.stdin);print('asset ok:',d.get('browser_download_url',str(d)[:150]))"
          rm -f "app.$EXT"
          git config user.email "eni@fabrica.local"
          git config user.name "eni-fabrica"
          git fetch origin apk-parts && git checkout -f -B apk-parts origin/apk-parts || { git checkout --orphan apk-parts && git rm -rf . > /dev/null 2>&1; }
          rm -rf "$APP" && mkdir -p "$APP/$V"
          mv /tmp/out/* "$APP/$V"/
          git add -A
          git commit -m "apk fetch: $APP $V (oficial, limpo)"
          git push -f origin apk-parts
          echo "PUBLICADO em apk-parts/$APP/$V/"
          ls -lh "$APP/$V"/
