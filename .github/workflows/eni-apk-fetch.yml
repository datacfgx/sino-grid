name: ENI APK Fetch
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "slug APKMirror do app"
        default: "capcut"
      dev:
        description: "slug do desenvolvedor no APKMirror"
        default: "bytedance-pte-ltd"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: cacar link direto no APKMirror
        run: |
          python3 << 'PY'
          import urllib.request, re, sys

          UA = {"User-Agent": "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"}
          base = "https://www.apkmirror.com"
          slug, dev = "${{ inputs.slug }}", "${{ inputs.dev }}"

          def get(url, ref=None):
              h = dict(UA)
              if ref: h["Referer"] = ref
              return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=30).read().decode("utf-8", "replace")

          cat = get(base + "/uploads/?appcategory=" + slug)
          links = [l for l in dict.fromkeys(re.findall(r'href="(/apk/' + dev + '/' + slug + '/[^"]*)"', cat)) if "download" not in l]
          links = [l for l in links if not any(b in l.lower() for b in ("beta", "alpha", "dogfood", "preview"))]
          if not links:
              sys.exit("sem versao estavel na categoria")

          escolhida = None
          for l in links[:6]:
              try:
                  vp = get(base + l)
              except Exception:
                  continue
              cands = []
              for m in re.finditer(r'href="(/apk/[^"]*/download/)"', vp):
                  ctx = vp[max(0, m.start()-400):m.end()].lower()
                  nota = 0
                  if ">apk<" in ctx or " apk " in ctx or "apk</" in ctx: nota += 2
                  if "bundle" in ctx: nota -= 5
                  if "arm64-v8a" in ctx: nota += 2
                  if "universal" in ctx: nota += 1
                  if "nodpi" in ctx: nota += 1
                  cands.append((nota, m.group(1)))
              cands.sort(reverse=True)
              if cands and cands[0][0] > 0:
                  escolhida = (l, cands[0][1])
                  break
          if not escolhida:
              sys.exit("sem variante APK utilizavel")
          vlink, dlink = escolhida

          dp = get(base + dlink, ref=base + vlink)
          finals = re.findall(r'href="([^"]*(?:download\.php\?id=\d+|\.apk(?:\?|$))[^"]*)"', dp)
          if not finals:
              sys.exit("sem link direto na pagina de download")
          final = finals[0]
          if final.startswith("/"):
              final = base + final

          vers = vlink.rstrip("/").split("/")[-1]
          open("/tmp/dl.txt", "w").write(final)
          open("/tmp/vers.txt", "w").write(vers)
          print("VERSAO:", vers)
          print("DIRETO:", final)
          PY

      - name: baixar e conferir
        run: |
          set -e
          DL=$(cat /tmp/dl.txt)
          curl -sSL --retry 3 -A "Mozilla/5.0 (Linux; Android 13) Chrome/120 Mobile Safari/537.36" -e "https://www.apkmirror.com/" -o app.apk "$DL"
          python3 - << 'PY'
          import os, sys
          sz = os.path.getsize("app.apk")
          with open("app.apk", "rb") as f: magic = f.read(2)
          print("tamanho:", sz, "magic:", magic)
          if magic != b"PK" or sz < 20_000_000:
              sys.exit("arquivo invalido (nao eh APK ou pequeno demais)")
          PY

      - name: fatiar e publicar no branch apk-parts
        run: |
          set -e
          V=$(cat /tmp/vers.txt)
          APP="${{ inputs.slug }}"
          mkdir -p /tmp/out
          split -b 45M -d -a 2 app.apk /tmp/out/parte_
          sha256sum app.apk > /tmp/out/sha256.txt
          echo "fonte: $(cat /tmp/dl.txt)" > /tmp/out/fonte.txt
          git config user.email "eni@fabrica.local"
          git config user.name "eni-fabrica"
          git fetch origin apk-parts && git checkout -f -B apk-parts origin/apk-parts || { git checkout --orphan apk-parts && git rm -rf . > /dev/null 2>&1; }
          rm -rf "$APP" && mkdir -p "$APP/$V"
          mv /tmp/out/* "$APP/$V"/
          git add -A
          git commit -m "apk fetch: $APP $V (oficial, limpo)"
          git push -f origin apk-parts
          echo "PUBLICADO em apk-parts/$APP/$V/"
          ls -lh "$APP/$V"/
