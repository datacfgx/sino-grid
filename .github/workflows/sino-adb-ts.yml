name: GH-KALI ADB Tailscale (tubo classico direto)
run-name: adb ${{ inputs.alvo }} via tailnet (porta auto)
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP do aparelho na tailnet (100.x.y.z)"
        required: true
        default: "100.72.251.47"
      comando:
        description: "Comando shell pra rodar"
        required: true
        default: "id"
jobs:
  adb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: platform-tools 33.0.3
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
      - name: Chave da casa + descobre porta + conecta + executa
        run: |
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
          export PATH=/tmp/platform-tools:$PATH
          ALVO="${{ inputs.alvo }}"
          echo "== varrendo $ALVO (30000-61000) =="
          PORTA=$(python3 - <<'PYEOF'
          import socket, concurrent.futures as cf
          alvo = "$ALVO"
          def t(p):
              try:
                  s = socket.create_connection((alvo, p), timeout=0.5)
                  s.close()
                  return p
              except Exception:
                  return None
          with cf.ThreadPoolExecutor(250) as ex:
              for r in ex.map(t, range(30000, 61001)):
                  if r:
                      print(r)
                      break
          PYEOF
          )
          echo "porta: $PORTA"
          A="$ALVO:$PORTA"
          adb connect "$A"
          sleep 3
          adb devices
          adb -s "$A" shell "${{ inputs.comando }}" > /tmp/saida.txt 2>&1 || true
          cat /tmp/saida.txt
          SAIDA=$(cat /tmp/saida.txt)
          python3 - "$A" <<'PYEOF'
          import json, os, sys, urllib.request
          txt = "ADB TAILSCALE " + sys.argv[1] + ":\n" + open("/tmp/saida.txt").read()[:700]
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": txt}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=15).read().decode())
          PYEOF
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
