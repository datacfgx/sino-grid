name: GH-KALI ADB Tailscale (tubo classico direto)
run-name: adb ${{ inputs.alvo }}:${{ inputs.porta }} via tailnet
on:
  workflow_dispatch:
    inputs:
      alvo:
        description: "IP do aparelho na tailnet (100.x.y.z)"
        required: true
        default: "100.72.251.47"
      porta:
        description: "Porta do adbd (visao Depuracao por Wi-Fi)"
        required: true
        default: "40333"
      comando:
        description: "Comando shell pra rodar"
        required: true
        default: "id"
jobs:
  adb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: 1.78.1
      - name: platform-tools 33.0.3
        run: |
          curl -sL -m 300 -o /tmp/pt.zip https://dl.google.com/android/repository/platform-tools_r33.0.3-linux.zip
          unzip -q /tmp/pt.zip -d /tmp
      - name: Chave da casa + conecta + executa
        run: |
          mkdir -p ~/.android
          cp tools/adbkey ~/.android/adbkey
          cp tools/adbkey.pub ~/.android/adbkey.pub
          chmod 600 ~/.android/adbkey
          export PATH=/tmp/platform-tools:$PATH
          A="${{ inputs.alvo }}:${{ inputs.porta }}"
          adb connect "$A"
          sleep 3
          adb devices
          adb -s "$A" shell "${{ inputs.comando }}" > /tmp/saida.txt 2>&1 || true
          cat /tmp/saida.txt
          python3 - <<PYEOF
          import json, os, urllib.request
          txt = "ADB TAILSCALE (${{ inputs.alvo }}:${{ inputs.porta }}):\n" + os.environ["SAIDA"][:700]
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": txt}).encode(),
              headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=15).read().decode())
          PYEOF
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
