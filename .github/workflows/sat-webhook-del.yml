name: sat webhook delete
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  del:
    runs-on: ubuntu-latest
    steps:
      - name: Deleta webhook e confirma no chat
        run: |
          R=$(curl -s -m 30 "https://api.telegram.org/bot8950924828:AAEgOh5mh7t0Zlly5Bpmy8c92gCYNMJwzxc/deleteWebhook")
          echo "deleteWebhook: $R"
          curl -s -m 30 "https://api.telegram.org/bot8950924828:AAEgOh5mh7t0Zlly5Bpmy8c92gCYNMJwzxc/sendMessage" \
            -d chat_id=7758901122 \
            --data-urlencode "text=sat webhook removido - escuta livre"
