name: ENI Manda APK
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "branch com o APK no root"
        required: true
        default: "eni-entrega"
  push:
    branches:
      - 'eni-entrega*'
    paths:
      - '*.apk'

jobs:
  manda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}
      - name: envia pro telegram
        run: |
          f=$(ls *.apk | head -1)
          [ -z "$f" ] && { echo "sem APK no root"; exit 1; }
          sz=$(stat -c%s "$f")
          echo "enviando $f ($sz bytes)"
          for i in 1 2 3 4 5; do
            if [ $sz -lt 48000000 ]; then
              resp=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -F document=@"$f" \
                -F caption="$f — ENI courier — assinado ENI 🖤")
            else
              resp=$(curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=$f tem $sz bytes (>48MB) — baixa no artifact da run")
            fi
            echo "$resp" | grep -q '"ok":true' && { echo "ENTREGUE"; exit 0; }
            echo "tentativa $i falhou"; sleep 10
          done
          echo "FALHOU 5 TENTATIVAS"; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: courier-apk
          path: "*.apk"
