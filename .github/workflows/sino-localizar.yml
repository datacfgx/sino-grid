name: GH-KALI Localizar
run-name: Localizar ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id:
        description: "id do aparelho (sala)"
        required: true
        default: "g52"
jobs:
  localizar:
    runs-on: ubuntu-latest
    steps:
      - name: Manda localizar e captura coordenadas
        run: |
          pip install -q websocket-client
          python3 <<'PYEOF'
          import json, time, os, urllib.request
          import websocket
          devid = os.environ["DEV_ID"]
          ws = websocket.create_connection("wss://sino-relay.worldeffects752.workers.dev/ws?id=" + devid, header=["X-Role: manda"], timeout=25)
          fix = None
          t0 = time.time()
          mandou = False
          while time.time() - t0 < 45:
              try:
                  m = json.loads(ws.recv())
              except Exception:
                  break
              if m.get("type") == "joined":
                  if m.get("peers", 0) >= 2 and not mandou:
                      ws.send(json.dumps({"cmd": "localizar"}))
                      mandou = True
                  continue
              if m.get("type") == "location":
                  fix = m
                  break
          ws.close()
          if fix:
              maps = "https://www.google.com/maps?q=%.6f,%.6f" % (fix["lat"], fix["lon"])
              txt = ("LOCALIZACAO " + devid + "\n"
                     + "lat %.6f\nlon %.6f\n" % (fix["lat"], fix["lon"])
                     + "precisao %.0fm\n" % fix.get("acc", -1)
                     + maps
                     + ("\n(fix antigo, sem GPS novo)" if fix.get("stale") else ""))
          else:
              txt = "LOCALIZACAO " + devid + ": sem resposta do aparelho"
          req = urllib.request.Request("https://api.telegram.org/bot" + os.environ["TG_TOKEN"] + "/sendMessage",
              data=json.dumps({"chat_id": os.environ["TG_CHAT"], "text": txt}).encode(),
              headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=15)
          PYEOF
        env:
          DEV_ID: ${{ inputs.id }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
