name: ENI Baixa
on:
  workflow_dispatch:
    inputs:
      url:
        description: "link de qualquer rede (tiktok, insta, twitter, vimeo...)"
        required: true
jobs:
  baixa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LINK_URL: ${{ github.event.inputs.url }}
    steps:
      - name: "cobalt local no runner (manual lido: API_URL obrigatorio, POST /, nscd)"
        run: |
          set -e
          T="${{ secrets.TELEGRAM_TOKEN }}"
          C="${{ secrets.TELEGRAM_CHAT_ID }}"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg nscd > /dev/null 2>&1
          sudo service nscd start || true
          npm i -g pnpm > /dev/null 2>&1 || true
          git clone --depth 1 https://github.com/imputnet/cobalt.git
          cd cobalt/api
          pnpm install > /dev/null 2>&1
          echo "API_URL=http://localhost:9000/" > .env
          nohup pnpm start > /tmp/cobalt.log 2>&1 &
          NOAR=""
          for i in $(seq 1 45); do
            if curl --noproxy "*" -s -o /dev/null -w "%{http_code}" http://127.0.0.1:9000/ 2>/dev/null | grep -q 200; then NOAR=1; break; fi
            sleep 2
          done
          if [ -z "$NOAR" ]; then
            echo "cobalt NAO subiu — log:"
            tail -20 /tmp/cobalt.log
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=ENI Baixa: cobalt nao subiu no runner (ver log da run)" || true
            exit 1
          fi
          echo "cobalt no ar de verdade"

          env | grep -i proxy || echo "sem proxy no ambiente"
          BODY=$(python3 -c "import json,os;print(json.dumps({'url':os.environ['LINK_URL'],'downloadMode':'auto'}))")
          echo "body: $BODY"
          RESP=$(curl --noproxy '*' -sS -X POST http://127.0.0.1:9000/ -H "Accept: application/json" -H "Content-Type: application/json" -d "$BODY" 2>/tmp/curlerr)
          RC=$?
          echo "curl rc=$RC err=$(cat /tmp/curlerr)"
          echo "resp: $RESP"
          tail -15 /tmp/cobalt.log || true

          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          url = d.get('url','')
          if not url and d.get('status') == 'picker' and d.get('picker'):
              url = d['picker'][0].get('url','')
          open('/tmp/durl.txt','w').write(url)
          open('/tmp/fname.txt','w').write(d.get('filename','midia.bin'))"
          DURL=$(cat /tmp/durl.txt)
          FNAME=$(cat /tmp/fname.txt)
          if [ -z "$DURL" ]; then
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=ENI Baixa: cobalt recusou esse link (rede sem suporte, privado, ou precisa de cookies)." || true
            exit 1
          fi

          curl -sL --max-time 280 -o saida "$DURL"
          S=$(stat -c%s saida)
          echo "baixado: $S bytes"
          if [ "$S" -le 48000000 ]; then
            curl -s -F chat_id="$C" -F document=@saida -F caption="ENI Baixa ok: $FNAME ($S bytes)" "https://api.telegram.org/bot$T/sendDocument"
            echo " inteiro entregue"
          else
            split -b 45000000 saida parte_
            for p in parte_*; do
              curl -s -F chat_id="$C" -F document=@"$p" "https://api.telegram.org/bot$T/sendDocument"
              sleep 3
            done
            curl -s -X POST "https://api.telegram.org/bot$T/sendMessage" -d chat_id="$C" --data-urlencode "text=junte no termux: cat parte_* > $FNAME" || true
            echo " fatiado e entregue"
          fi
