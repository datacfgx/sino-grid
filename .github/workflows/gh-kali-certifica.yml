name: GH-KALI Certifica
on:
  workflow_dispatch:
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 mesa-vulkan-drivers vulkan-tools && sudo chmod a+rw /dev/kvm || true
      - name: sdk e avd e build tools
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-30" "emulator" "system-images;android-30;google_apis;x86_64" "build-tools;34.0.0" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis;x86_64" --device "pixel_4" --force
          echo "SDK pronto"
      - name: build hello world da casa
        run: |
          set -e
          mkdir -p hw/res/values hw/src/eni/hello gen
          cat > hw/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">ENI Hello</string></resources>
          EOF
          sed -i 's/^          //' hw/res/values/strings.xml
          cat > hw/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="eni.hello" android:versionCode="1" android:versionName="1.0">
          <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="30"/>
          <application android:label="@string/app_name">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
          </activity>
          </application>
          </manifest>
          EOF
          sed -i 's/^          //' hw/AndroidManifest.xml
          cat > hw/src/eni/hello/MainActivity.java <<'EOF'
          package eni.hello;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  TextView t = new TextView(this);
                  t.setText("ENI CERTIFICADORA - pipeline OK");
                  t.setTextSize(22);
                  setContentView(t);
              }
          }
          EOF
          sed -i 's/^          //' hw/src/eni/hello/MainActivity.java
          BT="$GITHUB_WORKSPACE/sdk/build-tools/34.0.0"
          AJ="$GITHUB_WORKSPACE/sdk/platforms/android-30/android.jar"
          "$BT/aapt2" compile --dir hw/res -o compiled.zip
          "$BT/aapt2" link -o hw_base.apk -I "$AJ" --manifest hw/AndroidManifest.xml --java gen --min-sdk-version 24 --target-sdk-version 30
          javac -cp "$AJ" -d classes hw/src/eni/hello/MainActivity.java
          java -cp "$BT/lib/d8.jar" com.android.tools.r8.D8 --release --min-api 24 --output dexout classes/eni/hello/MainActivity.class
          cd dexout && zip -X -0 ../hw_base.apk classes.dex && cd ..
          curl -s https://raw.githubusercontent.com/datacfgx/sino-grid/eni-inbox/eni.keystore.b64 | base64 -d > eni.keystore
          "$BT/zipalign" -f -p 4 hw_base.apk hw_al.apk
          java -jar "$BT/lib/apksigner.jar" sign --ks eni.keystore --ks-pass pass:eni123456 --key-pass pass:eni123456 --ks-key-alias eni --out hello.apk hw_al.apk
          java -jar "$BT/lib/apksigner.jar" verify --print-certs hello.apk | head -2
          ls -la hello.apk
      - name: emulador e teste do hello
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd eni -no-window -no-audio -gpu swiftshader_indirect -accel on -no-metrics -wipe-data -no-snapshot -no-boot-anim -ports 5554,5555 > emulator.log 2>&1 &
          sleep 15
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; cat emulator.log; exit 1; }
          adb connect localhost:5555 > /dev/null 2>&1 || true
          BC=""
          for i in $(seq 1 45); do
            sleep 20
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BC" = "1" ] && break
          done
          echo "boot_completed=$BC"
          [ "$BC" = "1" ] || { echo "BOOT NAO COMPLETOU"; tail -20 emulator.log; exit 1; }
          echo "== instalando hello =="
          adb -s localhost:5555 install -r hello.apk
          echo "== abrindo =="
          adb -s localhost:5555 shell monkey -p eni.hello -c android.intent.category.LAUNCHER 1 || true
          sleep 20
          P1=$(adb -s localhost:5555 shell pidof eni.hello 2>/dev/null | tr -d '\r' || true)
          sleep 10
          P2=$(adb -s localhost:5555 shell pidof eni.hello 2>/dev/null | tr -d '\r' || true)
          adb -s localhost:5555 exec-out screencap -p > tela.png 2>/dev/null || true
          echo "P1=$P1 P2=$P2"
          if [ -n "$P1" ] && [ -n "$P2" ]; then V="CERTIFICADO - maquina sobe com APK instalado e aberto"; else V="FALHOU"; fi
          echo "VEREDITO=$V"
          echo "$V" > veredito.txt
      - name: resultado no telegram
        run: |
          V=$(cat veredito.txt 2>/dev/null || echo "?")
          for t in 1 2 3; do
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="VEREDITO FINAL da ideia: $V" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
            echo "foto $t: $R"
            case "$R" in *HTTP:200*) break;; esac
            sleep 10
          done
      - name: evidencias
        uses: actions/upload-artifact@v4
        with:
          name: certificacao-hello-final
          path: |
            tela.png
            veredito.txt
            emulator.log
