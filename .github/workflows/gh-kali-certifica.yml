name: GH-KALI Certifica
on:
  workflow_dispatch:
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 mesa-vulkan-drivers vulkan-tools && sudo chmod a+rw /dev/kvm || true
      - name: paciente da familia
        run: |
          R=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/datacfgx/miccam-eni/releases/latest)
          MID=$(echo "$R" | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d.get('assets',[]) if x['name'].endswith('.apk')]; print(a[0]['id'] if a else '')")
          echo "PACIENTE_ID=$MID"
          test -n "$MID" || { echo "paciente sem apk no release"; exit 1; }
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o paciente.apk "https://api.github.com/repos/datacfgx/miccam-eni/releases/assets/$MID"
          ls -la paciente.apk
      - name: sdk e avd
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis_playstore;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis_playstore;x86_64" --device "pixel_4" --force
      - name: emulador e certificacao generica
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd eni -no-window -no-audio -gpu swiftshader_indirect -accel on -no-metrics -wipe-data -no-snapshot -no-boot-anim -ports 5554,5555 > emulator.log 2>&1 &
          sleep 15
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; cat emulator.log; exit 1; }
          adb kill-server > /dev/null 2>&1 || true
          adb start-server > /dev/null 2>&1 || true
          SERIAL=""
          for i in $(seq 1 40); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            sleep 5
            SERIAL=$(adb devices 2>/dev/null | grep -E "emulator|5555" | grep -E "device$|unauthorized$" | awk '{print $1}' | head -1)
            echo "tentativa $i: SERIAL='$SERIAL'"
            [ -n "$SERIAL" ] && break
            sleep 8
          done
          [ -n "$SERIAL" ] || { echo "ADB NUNCA APARECEU"; adb devices -l; tail -30 emulator.log; exit 1; }
          BC=""
          for i in $(seq 1 45); do
            sleep 15
            BC=$(adb -s $SERIAL shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BC" = "1" ] && break
          done
          echo "boot_completed=$BC"
          [ "$BC" = "1" ] || { echo "BOOT NAO COMPLETOU"; tail -20 emulator.log; exit 1; }
          adb -s $SERIAL shell settings put global verifier_verify_adb_installs 0
          adb -s $SERIAL shell settings put global package_verifier_enable 0
          adb -s $SERIAL shell settings put global package_verifier_user_consent 1
          echo "== instalando =="
          adb -s $SERIAL install -r paciente.apk
          sleep 3
          PKG=$(adb -s $SERIAL shell pm list packages -3 2>/dev/null | tr -d '\r' | cut -d: -f2 | head -1)
          echo "PKG=$PKG"
          test -n "$PKG" || { echo "pacote nao identificado"; exit 1; }
          echo "== concedendo TODAS as permissoes (regra da casa) =="
          for p in $(adb -s $SERIAL shell dumpsys package "$PKG" | grep -oE "android.permission.[A-Z_]+" | sort -u); do
            adb -s $SERIAL shell pm grant "$PKG" "$p" 2>/dev/null && echo "granted $p" || true
          done
          adb -s $SERIAL shell appops set "$PKG" RECORD_AUDIO allow || true
          adb -s $SERIAL shell appops set "$PKG" CAMERA allow || true
          echo "== abrindo =="
          adb -s $SERIAL shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
          sleep 25
          P1=$(adb -s $SERIAL shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
          sleep 10
          P2=$(adb -s $SERIAL shell pidof "$PKG" 2>/dev/null | tr -d '\r' || true)
          adb -s $SERIAL exec-out screencap -p > tela.png 2>/dev/null || true
          adb -s $SERIAL logcat -d > logcat.txt 2>/dev/null || true
          echo "P1=$P1 P2=$P2"
          if [ -n "$P1" ] && [ -n "$P2" ]; then V="CERTIFICADO - maquina sobe com APK instalado"; else V="FALHOU"; fi
          echo "VEREDITO=$V"
          echo "$V" > veredito.txt
      - name: resultado no telegram
        run: |
          V=$(cat veredito.txt 2>/dev/null || echo "?")
          for t in 1 2 3; do
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="ENI Certifica: $V" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
            echo "foto $t: $R"
            case "$R" in *HTTP:200*) break;; esac
            sleep 10
          done
      - name: evidencias
        uses: actions/upload-artifact@v4
        with:
          name: certificacao-generica
          path: |
            tela.png
            logcat.txt
            veredito.txt
            emulator.log
