name: GH-KALI Certifica
on:
  workflow_dispatch:
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 mesa-vulkan-drivers vulkan-tools && sudo chmod a+rw /dev/kvm || true
      - name: apkeep baixa tezza da play
        run: |
          set -e
          AID=$(curl -s https://api.github.com/repos/EFForg/apkeep/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d['assets'] if 'x86_64' in x['name'] and 'linux' in x['name']]; print(a[0]['id'] if a else '')")
          test -n "$AID" || { echo "asset apkeep nao achado"; exit 1; }
          curl -sL -H "Accept: application/octet-stream" -o apkeep "https://api.github.com/repos/EFForg/apkeep/releases/assets/$AID"
          chmod +x apkeep && ./apkeep --help | head -20
          mkdir orig
          ./apkeep -a com.tezza -d gplay -e "worldeffects752@gmail.com:293847Ala@#" --split-apks orig || ./apkeep -a com.tezza -d gplay -e "worldeffects752@gmail.com:293847Ala@#" orig || true
          ls -la orig/
      - name: sdk e avd
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis;x86_64" --device "pixel_4" --force
      - name: emulador e tezza original
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd eni -no-window -no-audio -gpu swiftshader_indirect -accel on -no-metrics -wipe-data -no-snapshot -no-boot-anim -ports 5554,5555 > emulator.log 2>&1 &
          sleep 15
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; cat emulator.log; exit 1; }
          adb connect localhost:5555 > /dev/null 2>&1 || true
          BC=""
          for i in $(seq 1 45); do
            sleep 20
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BC" = "1" ] && break
          done
          echo "boot_completed=$BC"
          [ "$BC" = "1" ] || { echo "BOOT NAO COMPLETOU"; tail -20 emulator.log; exit 1; }
          echo "== preparando paciente =="
          mkdir px && cd px
          ls ../orig/
          if ls ../orig/*.xapk > /dev/null 2>&1; then
            unzip -q ../orig/*.xapk
          elif ls ../orig/*.apk > /dev/null 2>&1; then
            cp ../orig/*.apk .
          fi
          ls *.apk
          cd ..
          echo "== instalando =="
          adb -s localhost:5555 push px /data/local/tmp/px > /dev/null
          SES=$(adb -s localhost:5555 shell pm install-create -r 2>&1 | grep -oE '[0-9]+' | head -1)
          for f in px/*.apk; do
            b=$(basename "$f")
            adb -s localhost:5555 shell pm install-write "$SES" "${b%.apk}" "/data/local/tmp/px/$b"
          done
          adb -s localhost:5555 shell pm install-commit "$SES"
          echo "== abrindo =="
          adb -s localhost:5555 shell monkey -p org.tezza -c android.intent.category.LAUNCHER 1 || true
          sleep 35
          P1=$(adb -s localhost:5555 shell pidof org.tezza 2>/dev/null | tr -d '\r' || true)
          sleep 15
          P2=$(adb -s localhost:5555 shell pidof org.tezza 2>/dev/null | tr -d '\r' || true)
          adb -s localhost:5555 exec-out screencap -p > tela.png 2>/dev/null || true
          adb -s localhost:5555 logcat -d > logcat.txt 2>/dev/null || true
          echo "P1=$P1 P2=$P2"
          if [ -n "$P1" ] && [ -n "$P2" ]; then V="TEZZA ORIGINAL ABRIU (Play direto)"; else V="TEZZA ORIGINAL FALHOU"; fi
          echo "VEREDITO=$V"
          echo "$V" > veredito.txt
          grep -iE "fatal|org.tezza|pairip|unsatisfied" logcat.txt | tail -15 || true
      - name: resultado no telegram
        run: |
          V=$(cat veredito.txt 2>/dev/null || echo "?")
          for t in 1 2 3; do
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="DEGRAU 1 - Tezza original da Play: $V" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
            echo "foto $t: $R"
            case "$R" in *HTTP:200*) break;; esac
            sleep 10
          done
      - name: evidencias
        uses: actions/upload-artifact@v4
        with:
          name: tezza-original-play
          path: |
            tela.png
            logcat.txt
            veredito.txt
            emulator.log
