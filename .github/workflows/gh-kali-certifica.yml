name: GH-KALI Certifica
on:
  workflow_dispatch:
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 mesa-vulkan-drivers vulkan-tools && sudo chmod a+rw /dev/kvm || true
      - name: sdk e avd
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis;x86_64" --device "pixel_4" --force
          echo "AVD pronto"
      - name: paciente e fix do loader arm64
        run: |
          set -e
          ASSET_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/datacfgx/sino-grid/releases/tags/tezza-mod-v5 | python3 -c "import json,sys; d=json.load(sys.stdin); print([a['id'] for a in d['assets'] if a['name'].lower()=='tezza-mod.xapk'][0])")
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o paciente.xapk "https://api.github.com/repos/datacfgx/sino-grid/releases/assets/${ASSET_ID}"
          ls -la paciente.xapk
          curl -sL -o lspatch.jar https://github.com/LSPosed/LSPatch/releases/download/v0.6/jar-v0.6-398-release.jar
          mkdir x && cd x && unzip -q ../paciente.xapk && ls *.apk
          echo "== loaders no jar =="
          unzip -l ../lspatch.jar | grep -iE "loader|arm64" | head -10
          LOADER_ENTRY=$(unzip -l ../lspatch.jar | grep -iE "arm64.*loader|loader.*arm64" | head -1 | awk '{print $4}')
          echo "LOADER_ENTRY=$LOADER_ENTRY"
          test -n "$LOADER_ENTRY" || { echo "loader arm64 nao achado no jar"; exit 1; }
          mkdir -p /tmp/ldr && unzip -o -j ../lspatch.jar "$LOADER_ENTRY" -d /tmp/ldr
          mkdir -p /tmp/ldrapk && unzip -q -o /tmp/ldr/$(basename "$LOADER_ENTRY") -d /tmp/ldrapk
          find /tmp/ldrapk -name "liblspatch.so" | head -3
          SO=$(find /tmp/ldrapk -path "*arm64*" -name "liblspatch.so" | head -1)
          test -n "$SO" || SO=$(find /tmp/ldrapk -name "liblspatch.so" | head -1)
          echo "SO=$SO"
          BASE=$(ls *.apk | grep -ivE "config|split" | head -1)
          echo "BASE=$BASE"
          mkdir -p work/assets/lspatch/so/arm64-v8a
          cp "$SO" work/assets/lspatch/so/arm64-v8a/liblspatch.so
          cp "$BASE" work/base_fixed.apk
          cd work && zip -X -0 base_fixed.apk assets/lspatch/so/arm64-v8a/liblspatch.so
          unzip -l base_fixed.apk | grep lspatch
          cd "$GITHUB_WORKSPACE"
          curl -sL -o bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q bt.zip && mv android-14 bt
          printf "eni123456\neni123456\n" | keytool -genkeypair -alias eni -keyalg RSA -keysize 2048 -validity 10000 -keystore eni.keystore -dname "CN=ENI, O=ENIeLO, OU=Casa" 2>/dev/null || true
          bt/zipalign -f -p 4 work/base_fixed.apk work/base_al.apk
          java -jar bt/lib/apksigner.jar sign --ks eni.keystore --ks-pass pass:eni123456 --key-pass pass:eni123456 --ks-key-alias eni --out x/$BASE work/base_al.apk
          java -jar bt/lib/apksigner.jar verify --print-certs x/$BASE | head -3
          echo "base fixada e assinada"
      - name: emulador e certificacao
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd eni -no-window -no-audio -gpu swiftshader_indirect -accel on -no-metrics -wipe-data -no-snapshot -no-boot-anim -ports 5554,5555 > emulator.log 2>&1 &
          sleep 15
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; cat emulator.log; exit 1; }
          adb connect localhost:5555 > /dev/null 2>&1 || true
          BC=""
          for i in $(seq 1 45); do
            sleep 20
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BC" = "1" ] && break
          done
          echo "boot_completed=$BC"
          [ "$BC" = "1" ] || { echo "BOOT NAO COMPLETOU"; tail -20 emulator.log; exit 1; }
          echo "== instalando =="
          adb -s localhost:5555 push x /data/local/tmp/x > /dev/null
          SES=$(adb -s localhost:5555 shell pm install-create -r 2>&1 | grep -oE '[0-9]+' | head -1)
          for f in x/*.apk; do
            b=$(basename "$f")
            adb -s localhost:5555 shell pm install-write "$SES" "${b%.apk}" "/data/local/tmp/x/$b"
          done
          adb -s localhost:5555 shell pm install-commit "$SES"
          echo "== abrindo =="
          adb -s localhost:5555 shell monkey -p org.tezza -c android.intent.category.LAUNCHER 1 || true
          sleep 35
          P1=$(adb -s localhost:5555 shell pidof org.tezza 2>/dev/null | tr -d '\r' || true)
          sleep 15
          P2=$(adb -s localhost:5555 shell pidof org.tezza 2>/dev/null | tr -d '\r' || true)
          adb -s localhost:5555 exec-out screencap -p > tela.png 2>/dev/null || true
          adb -s localhost:5555 logcat -d > logcat.txt 2>/dev/null || true
          echo "P1=$P1 P2=$P2"
          if [ -n "$P1" ] && [ -n "$P2" ]; then V="CERTIFICADO"; else V="FALHOU"; fi
          echo "VEREDITO=$V"
          echo "$V" > veredito.txt
          grep -iE "fatal|org.tezza|pairip|unsatisfied" logcat.txt | tail -20 || true
      - name: resultado no telegram
        run: |
          V=$(cat veredito.txt 2>/dev/null || echo "?")
          echo "veredito=$V"
          if [ -s tela.png ]; then
            for t in 1 2 3; do
              R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="ENI Certifica Tezza v5+arm64loader -> $V" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
              echo "foto $t: $R"
              case "$R" in *HTTP:200*) break;; esac
              sleep 10
            done
          fi
      - name: evidencias
        uses: actions/upload-artifact@v4
        with:
          name: certificacao-tezza-v5-arm64loader
          path: |
            tela.png
            logcat.txt
            veredito.txt
            emulator.log
