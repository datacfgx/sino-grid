name: GH-KALI Certifica
on:
  workflow_dispatch:
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 mesa-vulkan-drivers vulkan-tools && sudo chmod a+rw /dev/kvm || true
      - name: tezza original play ou deposito
        run: |
          set -e
          mkdir orig
          echo "== rota 1: apkeep com a burn (erro visivel) =="
          AID=$(curl -s https://api.github.com/repos/EFForg/apkeep/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d['assets'] if 'x86_64' in x['name'] and 'linux' in x['name'] and 'gnu' in x['name'] and 'sha' not in x['name'].lower() and 'sig' not in x['name'].lower()]; print(a[0]['id'] if a else '')")
          echo "AID=$AID"
          curl -sL -H "Accept: application/octet-stream" -o apkeep "https://api.github.com/repos/EFForg/apkeep/releases/assets/$AID"
          chmod +x apkeep
          file apkeep
          head -c 4 apkeep | od -c | head -1
          ./apkeep -a com.tezza -d gplay -e "worldeffects752@gmail.com:293847Ala@#" -o device=panther orig 2>&1 | tail -5 || echo "APKEEP FALHOU (ver acima)"
          ls -la orig/ || true
          if [ -z "$(ls -A orig 2>/dev/null)" ]; then
            echo "== rota 2: deposito da casa (bytes originais) =="
            ART=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/datacfgx/sino-grid/actions/artifacts?per_page=100" | python3 -c "import json,sys; d=json.load(sys.stdin); a=sorted([x for x in d['artifacts'] if x['name']=='deposito' and x.get('size_in_bytes',0)>3e8], key=lambda x:-x.get('size_in_bytes',0)); print(a[0]['id'] if a else '')")
            echo "ART=$ART"
            test -n "$ART"
            curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o dep.zip "https://api.github.com/repos/datacfgx/sino-grid/actions/artifacts/$ART/zip"
            ls -la dep.zip
            unzip -q dep.zip -d depout
            ls depout/ | head
            cat depout/tezza_cm_* > orig/paciente.pacote
            mv orig/paciente.pacote orig/paciente.xapk
          fi
          ls -la orig/
          F=$(ls orig/* | head -1)
          echo "PACIENTE=$F"
      - name: sdk e avd
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis_playstore;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis_playstore;x86_64" --device "pixel_4" --force
      - name: emulador e tezza original
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd eni -no-window -no-audio -gpu swiftshader_indirect -accel on -no-metrics -wipe-data -no-snapshot -no-boot-anim -ports 5554,5555 > emulator.log 2>&1 &
          sleep 15
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; cat emulator.log; exit 1; }
          adb kill-server > /dev/null 2>&1 || true
          adb start-server > /dev/null 2>&1 || true
          SERIAL=""
          for i in $(seq 1 40); do
            adb connect localhost:5555 > /dev/null 2>&1 || true
            sleep 5
            SERIAL=$(adb devices 2>/dev/null | grep -E "emulator|5555" | grep -E "device$|unauthorized$" | awk '{print $1}' | head -1)
            echo "tentativa $i: SERIAL='$SERIAL'"
            [ -n "$SERIAL" ] && break
            sleep 8
          done
          [ -n "$SERIAL" ] || { echo "ADB NUNCA APARECEU"; adb devices -l; tail -30 emulator.log; exit 1; }
          BC=""
          for i in $(seq 1 45); do
            sleep 15
            BC=$(adb -s $SERIAL shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BC" = "1" ] && break
          done
          echo "boot_completed=$BC"
          [ "$BC" = "1" ] || { echo "BOOT NAO COMPLETOU"; tail -20 emulator.log; exit 1; }
          adb -s $SERIAL shell settings put global verifier_verify_adb_installs 0
          adb -s $SERIAL shell settings put global package_verifier_enable 0
          echo "== preparando paciente =="
          mkdir px && cd px
          if ls ../orig/*.xapk > /dev/null 2>&1; then
            unzip -q ../orig/*.xapk
          else
            cp ../orig/* apk 2>/dev/null || cp ../orig/* .
          fi
          ls *.apk
          cd ..
          echo "== instalando =="
          adb -s $SERIAL push px /data/local/tmp/px > /dev/null
          SES=$(adb -s $SERIAL shell pm install-create -r 2>&1 | grep -oE '[0-9]+' | head -1)
          for f in px/*.apk; do
            b=$(basename "$f")
            adb -s $SERIAL shell pm install-write "$SES" "${b%.apk}" "/data/local/tmp/px/$b"
          done
          adb -s $SERIAL shell pm install-commit "$SES"
          echo "== abrindo =="
          adb -s $SERIAL shell monkey -p org.tezza -c android.intent.category.LAUNCHER 1 || true
          sleep 35
          P1=$(adb -s $SERIAL shell pidof org.tezza 2>/dev/null | tr -d '\r' || true)
          sleep 15
          P2=$(adb -s $SERIAL shell pidof org.tezza 2>/dev/null | tr -d '\r' || true)
          adb -s $SERIAL exec-out screencap -p > tela.png 2>/dev/null || true
          adb -s $SERIAL logcat -d > logcat.txt 2>/dev/null || true
          echo "P1=$P1 P2=$P2"
          if [ -n "$P1" ] && [ -n "$P2" ]; then V="TEZZA ORIGINAL ABRIU (degrau 1 OK)"; else V="TEZZA ORIGINAL FALHOU"; fi
          echo "VEREDITO=$V"
          echo "$V" > veredito.txt
          grep -iE "fatal|org.tezza|pairip|unsatisfied" logcat.txt | tail -12 || true
      - name: resultado no telegram
        run: |
          V=$(cat veredito.txt 2>/dev/null || echo "?")
          for t in 1 2 3; do
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="DEGRAU 1 (original): $V" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
            echo "foto $t: $R"
            case "$R" in *HTTP:200*) break;; esac
            sleep 10
          done
      - name: evidencias
        uses: actions/upload-artifact@v4
        with:
          name: tezza-degrau1-original
          path: |
            tela.png
            logcat.txt
            veredito.txt
