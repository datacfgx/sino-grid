name: GH-KALI Certifica
on:
  workflow_dispatch:
jobs:
  certifica:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openjdk-17-jre-headless unzip libnss3 libxss1 libasound2t64 libpulse0 libxcursor1 libxinerama1 libxkbcommon0 mesa-vulkan-drivers vulkan-tools && sudo chmod a+rw /dev/kvm || true
      - name: whatsapp apk
        run: |
          ok=""
          echo "== rota 1: site oficial =="
          curl -sL --max-time 120 -o zap.apk "https://www.whatsapp.com/android/current/WhatsApp.apk" || true
          S=$(stat -c%s zap.apk 2>/dev/null || echo 0)
          echo "tamanho: $S"
          if [ "$S" -gt 30000000 ] && unzip -l zap.apk > /dev/null 2>&1; then ok=1; echo "oficial OK"; fi
          if [ -z "$ok" ]; then
            echo "== rota 2: apkeep com a burn =="
            AID=$(curl -s https://api.github.com/repos/EFForg/apkeep/releases/latest | python3 -c "import json,sys; d=json.load(sys.stdin); a=[x for x in d['assets'] if 'x86_64' in x['name'] and 'linux' in x['name']]; print(a[0]['id'] if a else '')")
            curl -sL -H "Accept: application/octet-stream" -o apkeep "https://api.github.com/repos/EFForg/apkeep/releases/assets/$AID" && chmod +x apkeep
            ./apkeep -a com.whatsapp -d gplay -e "worldeffects752@gmail.com:293847Ala@#" . 2>&1 | tail -3 || true
            ls -la *.apk 2>/dev/null || true
            for f in com.whatsapp*.apk WhatsApp*.apk; do
              [ -f "$f" ] && S=$(stat -c%s "$f") && [ "$S" -gt 30000000 ] && cp "$f" zap.apk && ok=1 && echo "apkeep OK ($f)" && break
            done
          fi
          if [ -z "$ok" ]; then
            echo "== rota 3: apkpure =="
            curl -sL --max-time 120 -A "Mozilla/5.0" -o zap.apk "https://d.apkpure.com/b/APK/com.whatsapp?version=latest" || true
            S=$(stat -c%s zap.apk 2>/dev/null || echo 0)
            echo "tamanho: $S"
            if [ "$S" -gt 30000000 ] && unzip -l zap.apk > /dev/null 2>&1; then ok=1; echo "apkpure OK"; fi
          fi
          test -n "$ok" || { echo "nenhuma rota deu zap"; exit 1; }
          ls -la zap.apk
      - name: sdk e avd
        run: |
          set -e
          mkdir -p sdk/cmdline-tools && cd sdk/cmdline-tools
          curl -sL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q clt.zip && rm clt.zip && mv cmdline-tools latest
          cd "$GITHUB_WORKSPACE/sdk"
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n eni -k "system-images;android-30;google_apis;x86_64" --device "pixel_4" --force
      - name: emulador e whatsapp
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/sdk"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/avd"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          nohup emulator -avd eni -no-window -no-audio -gpu swiftshader_indirect -accel on -no-metrics -wipe-data -no-snapshot -no-boot-anim -ports 5554,5555 > emulator.log 2>&1 &
          sleep 15
          ps aux | grep -q "[e]mulator" || { echo "EMULADOR MORTO"; cat emulator.log; exit 1; }
          adb connect localhost:5555 > /dev/null 2>&1 || true
          BC=""
          for i in $(seq 1 45); do
            sleep 20
            BC=$(adb -s localhost:5555 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$BC" = "1" ] && break
          done
          echo "boot_completed=$BC"
          [ "$BC" = "1" ] || { echo "BOOT NAO COMPLETOU"; tail -20 emulator.log; exit 1; }
          adb -s localhost:5555 shell settings put global verifier_verify_adb_installs 0
          adb -s localhost:5555 shell settings put global package_verifier_enable 0
          echo "== instalando whatsapp =="
          adb -s localhost:5555 install -r zap.apk
          echo "== abrindo =="
          adb -s localhost:5555 shell monkey -p com.whatsapp -c android.intent.category.LAUNCHER 1 || true
          sleep 30
          W1=$(adb -s localhost:5555 shell pidof com.whatsapp 2>/dev/null | tr -d '\r' || true)
          sleep 10
          W2=$(adb -s localhost:5555 shell pidof com.whatsapp 2>/dev/null | tr -d '\r' || true)
          adb -s localhost:5555 exec-out screencap -p > tela.png 2>/dev/null || true
          adb -s localhost:5555 logcat -d > logcat.txt 2>/dev/null || true
          echo "ZAP P1=$W1 P2=$W2"
          if [ -n "$W1" ] && [ -n "$W2" ]; then V="WHATSAPP SOBE NO EMULADOR - zap roda na maquina da familia"; else V="WHATSAPP FALHOU"; fi
          echo "VEREDITO=$V"
          echo "$V" > veredito.txt
      - name: resultado no telegram
        run: |
          V=$(cat veredito.txt 2>/dev/null || echo "?")
          for t in 1 2 3; do
            R=$(curl -s -w "HTTP:%{http_code}" -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" -F photo=@tela.png -F caption="$V" "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendPhoto")
            echo "foto $t: $R"
            case "$R" in *HTTP:200*) break;; esac
            sleep 10
          done
      - name: evidencias
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-emulador
          path: |
            tela.png
            logcat.txt
            veredito.txt
